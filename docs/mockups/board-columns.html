<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mission Control · Board columns (empty-column treatments + backlog)</title>
    <link rel="stylesheet" href="theme.css" />
    <style>
      /*
       * BOARD COLUMNS - four treatments for empty columns, plus a Backlog column
       * you dispatch from by dragging onto an idle agent.
       *
       * SHIPPED: treatment C. Kept as a four-way comparison rather than trimmed to
       * the winner, because what the choice cost is the useful part of the record -
       * C buys the all-clear back at the price of the stable column positions A
       * would have kept.
       *
       * The four treatments differ ONLY in what an empty column does. Everything
       * else - tiles, tones, ordering, the backlog rail - is identical across
       * them, so the comparison is fair. Switch treatment and scenario with the
       * two rows of buttons; drag a backlog card onto any idle tile to dispatch.
       */

      /* ---- lab chrome (not part of the product) ---- */
      .lab {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        padding: 9px 20px;
        border-bottom: 1px solid var(--border-soft);
        background: color-mix(in oklab, var(--bg-2) 70%, transparent);
      }
      .lab b {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.1px;
        text-transform: uppercase;
        color: var(--dim);
        margin-right: 2px;
      }
      .lab button {
        padding: 4px 10px;
        font: inherit;
        font-size: 11.5px;
        color: var(--muted);
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 7px;
        cursor: pointer;
      }
      .lab button:hover {
        color: var(--fg);
        border-color: color-mix(in oklab, var(--select) 40%, var(--border));
      }
      .lab button.on {
        color: var(--bg);
        font-weight: 650;
        background: var(--select);
        border-color: var(--select);
      }
      .lab .rec {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: var(--idle);
        border: 1px solid color-mix(in oklab, var(--idle) 40%, var(--border));
        border-radius: 999px;
        padding: 1px 6px;
      }
      .lab button.on .rec {
        color: var(--bg);
        border-color: color-mix(in oklab, var(--bg) 35%, transparent);
      }
      .lab .spacer {
        flex: 1;
      }
      .caption {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 10px 20px 0;
        font-size: 12px;
        line-height: 1.55;
        color: var(--muted);
        max-width: 1100px;
      }
      .caption .k {
        flex: none;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--dim);
      }
      .caption em {
        color: var(--attention);
        font-style: normal;
      }

      /* ---- board shell ---- */
      .board {
        flex: 1;
        min-height: 0;
        display: flex;
        align-items: stretch;
        gap: 14px;
        padding: 14px 20px 20px;
        overflow-x: auto;
      }
      .col {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1 1 0;
        min-width: 248px;
        overflow: hidden;
        border: 1px solid var(--border-soft);
        border-radius: var(--radius);
        background: color-mix(in oklab, var(--bg-2) 55%, transparent);
        transition:
          flex-grow 0.28s ease,
          flex-basis 0.28s ease,
          min-width 0.28s ease,
          opacity 0.22s ease;
      }
      .col-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 12px;
        border-bottom: 1px solid var(--border-soft);
        white-space: nowrap;
      }
      .col-head .swatch {
        flex: none;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--tone-color, var(--neutral));
      }
      .col-head h2 {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: var(--tone-color, var(--muted));
      }
      .col-head .n {
        margin-left: auto;
        font-size: 11.5px;
        font-weight: 680;
        font-variant-numeric: tabular-nums;
        color: var(--dim);
        padding: 1px 7px;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
        background: var(--panel);
      }
      .col-attention {
        border-color: color-mix(in oklab, var(--attention) 32%, var(--border));
        background: color-mix(in oklab, var(--attention) 5%, transparent);
      }
      .col-attention .col-head .swatch {
        box-shadow: 0 0 10px var(--attention);
      }
      .col-body {
        display: flex;
        flex-direction: column;
        gap: 9px;
        padding: 9px;
        overflow-y: auto;
      }
      .col-empty {
        margin: 0;
        padding: 14px 4px;
        text-align: center;
        font-size: 11.5px;
        color: var(--dim);
      }

      /* An empty "needs you" column read as the good news it is, rather than as a
         hole in the board. Used by the treatments that keep it on screen.
         It stays on the board, but it does NOT claim an equal share of the width:
         a 250px status card says "all clear" just as well as a 700px one, and the
         columns that do have sessions in them get the difference. */
      .col.calm {
        flex: 0 1 250px;
        min-width: 218px;
      }
      .all-clear {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 5px;
        flex: 1;
        padding: 22px 10px;
        text-align: center;
      }
      .all-clear .tick {
        font-size: 17px;
        color: var(--idle);
      }
      .all-clear b {
        font-size: 12px;
        font-weight: 640;
        color: var(--muted);
      }
      .all-clear span {
        font-size: 11px;
        color: var(--dim);
      }

      /* ---- treatment: SPINE (shrink an empty column to a vertical strip) ---- */
      .col.spine {
        flex: 0 0 42px;
        min-width: 42px;
        cursor: pointer;
        background: color-mix(in oklab, var(--bg-2) 30%, transparent);
      }
      .col.spine:hover {
        background: color-mix(in oklab, var(--bg-2) 60%, transparent);
        border-color: var(--border);
      }
      /* The head becomes the whole column: swatch pinned top, label turned on its
         side reading downward (so it follows the swatch, not fights it), count
         pinned to the bottom where the eye already expects a column total. */
      .col.spine .col-head {
        flex: 1;
        flex-direction: column;
        gap: 10px;
        padding: 11px 0 9px;
        border-bottom: 0;
      }
      .col.spine .col-head h2 {
        writing-mode: vertical-rl;
      }
      .col.spine .col-head .n {
        margin-left: 0;
        margin-top: auto;
        padding: 0 6px;
        font-size: 11px;
      }
      .col.spine .col-body {
        display: none;
      }

      /* ---- treatment: HIDE (drop the column, park it in a rail on the right) ---- */
      .col.gone {
        display: none;
      }
      .stash {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 7px;
        align-items: stretch;
        padding-top: 2px;
      }
      .stash-lab {
        font-size: 9.5px;
        font-weight: 800;
        letter-spacing: 0.7px;
        text-transform: uppercase;
        color: var(--dim);
        text-align: center;
      }
      .stash button {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        font: inherit;
        font-size: 10.5px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--dim);
        background: transparent;
        border: 1px dashed var(--border);
        border-radius: 8px;
        cursor: pointer;
      }
      .stash button:hover {
        color: var(--muted);
        border-style: solid;
        background: var(--panel);
      }
      .stash button .swatch {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--tone-color, var(--neutral));
        opacity: 0.55;
      }

      /* ---- backlog column ---- */
      .col-backlog {
        flex: 0 0 232px;
        min-width: 232px;
        border-style: dashed;
        border-color: color-mix(in oklab, var(--pr-merged) 30%, var(--border));
        background: color-mix(in oklab, var(--pr-merged) 5%, transparent);
      }
      .col-backlog .col-head .swatch {
        background: var(--pr-merged);
        border-radius: 2px;
      }
      .col-backlog .col-head h2 {
        color: color-mix(in oklab, var(--pr-merged) 65%, var(--fg));
      }
      .bl-card {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 9px 10px 8px 12px;
        text-align: left;
        font: inherit;
        color: var(--fg);
        background: linear-gradient(var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 10px;
        cursor: grab;
        transition:
          transform 0.14s ease,
          border-color 0.14s ease,
          opacity 0.14s ease;
      }
      .bl-card::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 10px 0 0 10px;
        background: var(--pr-merged);
        opacity: 0.75;
      }
      .bl-card:hover {
        transform: translateY(-1px);
        border-color: color-mix(in oklab, var(--pr-merged) 45%, var(--border));
      }
      .bl-card:active {
        cursor: grabbing;
      }
      .bl-card.lifting {
        opacity: 0.4;
      }
      .bl-text {
        font-size: 12px;
        line-height: 1.42;
      }
      .bl-foot {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        color: var(--dim);
      }
      .bl-foot .grip {
        margin-left: auto;
        letter-spacing: 1px;
        color: var(--border);
      }
      .bl-repo {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--idle);
      }
      .bl-agent {
        padding: 0 5px;
        border: 1px solid var(--border-soft);
        border-radius: 999px;
      }

      /* ---- drag state ---- */
      /* While a backlog card is in the air the board answers one question only:
         which agents can take it. Idle tiles light; everything else recedes. */
      body.dragging .tile:not(.tone-idle) {
        opacity: 0.32;
      }
      body.dragging .col:not(.col-idle):not(.col-backlog) {
        opacity: 0.55;
      }
      body.dragging .tile.tone-idle {
        border-color: color-mix(in oklab, var(--select) 55%, var(--border));
        box-shadow: 0 0 0 1px color-mix(in oklab, var(--select) 30%, transparent);
      }
      .tile.drop-on {
        border-color: var(--select) !important;
        box-shadow:
          0 0 0 2px var(--select),
          0 0 22px color-mix(in oklab, var(--select) 30%, transparent) !important;
        transform: translateY(-2px);
      }
      .tile.drop-on .tile-goal {
        color: var(--select);
      }
      .drop-hint {
        display: none;
        gap: 5px;
        align-items: center;
        font-size: 10.5px;
        font-weight: 650;
        color: var(--select);
      }
      body.dragging .tile.tone-idle .drop-hint {
        display: flex;
      }
      /* An idle column with no agents in it is the one empty column that matters
         mid-drag: it tells you there is nowhere to drop. */
      body.dragging .col-idle {
        border-color: color-mix(in oklab, var(--select) 45%, var(--border));
      }

      /* ---- tile (same as the shipping board) ---- */
      .tile {
        position: relative;
        display: flex;
        flex-direction: column;
        gap: 7px;
        width: 100%;
        padding: 10px 11px 9px 13px;
        text-align: left;
        font: inherit;
        color: var(--fg);
        background: linear-gradient(var(--panel), var(--panel-2));
        border: 1px solid var(--border);
        border-radius: 10px;
        box-shadow: var(--shadow);
        cursor: pointer;
        transition:
          transform 0.14s ease,
          border-color 0.14s ease,
          opacity 0.14s ease,
          box-shadow 0.14s ease;
      }
      .tile::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        border-radius: 10px 0 0 10px;
        background: var(--tone-color, var(--neutral));
      }
      .tile:hover {
        transform: translateY(-2px);
        border-color: color-mix(in oklab, var(--tone-color, var(--neutral)) 40%, var(--border));
      }
      .tile.attention {
        border-color: color-mix(in oklab, var(--attention) 45%, var(--border));
      }
      .tile.exited {
        opacity: 0.6;
      }
      .tile.just-took {
        animation: took 1.1s ease;
      }
      @keyframes took {
        0% {
          box-shadow: 0 0 0 2px var(--select);
        }
        100% {
          box-shadow: var(--shadow);
        }
      }
      .tile-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .tile-head h3 {
        margin: 0;
        min-width: 0;
        flex: 1;
        font-size: 12.5px;
        font-weight: 640;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile-goal {
        margin: 0;
        font-size: 11.5px;
        line-height: 1.4;
        color: var(--muted);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tile-goal.none {
        color: var(--dim);
        font-size: 11px;
      }
      .tile-marks {
        display: flex;
        align-items: center;
        gap: 6px;
        flex-wrap: wrap;
      }
      .tile-foot {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 10.5px;
        color: var(--dim);
      }
      .tile-foot .spacer {
        flex: 1;
      }
      .tile-branch {
        min-width: 0;
        font-family: var(--mono);
        font-size: 10px;
        color: var(--idle);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tile-rail {
        display: flex;
        gap: 2px;
      }
      .tile-rail span {
        flex: 1;
        height: 3px;
        border-radius: 2px;
        background: var(--border);
      }
      .tile-rail .nm-done {
        background: var(--idle);
      }
      .tile-rail .nm-run {
        background: var(--working);
        animation: breathe 1.6s ease-in-out infinite;
      }
      .tile-rail .nm-gate {
        background: var(--attention);
      }
      .tile-rail .nm-fail {
        background: var(--danger);
      }
      .tile-rail .nm-skip {
        background: var(--dim);
      }

      /* ---- toast ---- */
      .toast {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 9px 14px;
        font-size: 12px;
        color: var(--fg);
        background: var(--panel);
        border: 1px solid color-mix(in oklab, var(--select) 45%, var(--border));
        border-radius: 10px;
        box-shadow: var(--shadow);
        animation: rise 0.18s ease;
      }
      @keyframes rise {
        from {
          transform: translate(-50%, 8px);
          opacity: 0;
        }
      }
      .toast .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--select);
      }
      .toast button {
        font: inherit;
        font-size: 11.5px;
        color: var(--muted);
        background: none;
        border: 0;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        padding: 0;
      }
      .toast button:hover {
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="data.js"></script>
    <script>
      /* ------------------------------------------------------------------ *
       * State
       * ------------------------------------------------------------------ */

      const TREATMENTS = [
        {
          id: "spine",
          label: "A · Shrink to a spine",
          rec: false,
          caption:
            "Every empty column collapses to a 42px strip with its label turned on its side. The board keeps <em>all five states in the same place, always</em> - your muscle memory for &ldquo;needs you is the left column&rdquo; survives, and an empty column is still countable at a glance. Click a spine to pop it back open. Cost: five spines on a quiet fleet is a lot of vertical pinstripe for zero content.",
        },
        {
          id: "hide",
          label: "B · Hide, park in a rail",
          rec: false,
          caption:
            "Empty columns leave the board entirely; the remaining ones expand to fill. A dashed rail on the right keeps them one click from returning, so nothing is <em>lost</em>, only stowed. Maximum room per tile. Cost: column positions move as sessions come and go, and an empty &ldquo;needs you&rdquo; - the single most reassuring thing on this screen - disappears with everything else.",
        },
        {
          id: "keep-attention",
          label: "C · Hide, but keep Needs you",
          rec: true,
          caption:
            "Same as B, except <em>Needs you never leaves</em>: empty, it renders as an explicit all-clear rather than a gap. That preserves the one reading you actually want the board to give you fast - is anything waiting on me? - while everything dormant still gets out of the way.",
        },
        {
          id: "tiered",
          label: "D · Tiered",
          rec: false,
          caption:
            "One rule per tier instead of one rule for all. <em>Needs you</em>: always a full column, all-clear when empty. <em>Working / Idle</em> (live states you'd expect to refill within the minute): shrink to a spine, so the board doesn't reflow every time an agent finishes. <em>Unconfirmed / Gone</em> (dormant): hidden into the rail. The board only spends width on what could plausibly change.",
        },
      ];

      const SCENARIOS = [
        { id: "full", label: "Full fleet", tones: ["attention", "working", "idle", "neutral", "exited"] },
        { id: "afternoon", label: "Typical afternoon", tones: ["attention", "working", "idle"] },
        { id: "firedrill", label: "Fire drill", tones: ["attention", "working"] },
        { id: "allclear", label: "All clear", tones: ["idle"] },
      ];

      const COLS = [
        ["attention", "Needs you"],
        ["working", "Working"],
        ["idle", "Idle"],
        ["neutral", "Unconfirmed"],
        ["exited", "Gone"],
      ];

      const BACKLOG_SEED = [
        { id: "b1", text: "Shrink or hide empty board columns", repo: "ai-harness", agent: "claude", age: "added 12m ago" },
        { id: "b2", text: "Roundup email digest should link straight to the session", repo: "ai-harness", agent: "claude", age: "added 1h ago" },
        { id: "b3", text: "Codex sessions: fall back to cwd for a goal", repo: "ai-harness", agent: "codex", age: "added 3h ago" },
        { id: "b4", text: "Kill the flaky reset-parks test", repo: "ai-harness", agent: "claude", age: "yesterday" },
      ];

      let treatment = "tiered";
      let scenario = "afternoon";
      let popped = new Set(); // spines the user clicked open
      let restored = new Set(); // hidden columns the user pulled back from the rail
      let backlog = BACKLOG_SEED.map((t) => ({ ...t }));
      let live = SESSIONS.map((s) => ({ ...s }));
      let dragId = null;
      let tookId = null;
      let toast = null;
      let toastTimer = null;

      /* ------------------------------------------------------------------ *
       * How a column is treated, given the current mode
       * ------------------------------------------------------------------ */

      function modeFor(tone, count) {
        if (count > 0) return "open";
        if (popped.has(tone) || restored.has(tone)) return "open";
        switch (treatment) {
          case "spine":
            return "spine";
          case "hide":
            return "hidden";
          case "keep-attention":
            return tone === "attention" ? "allclear" : "hidden";
          case "tiered":
            if (tone === "attention") return "allclear";
            if (tone === "working" || tone === "idle") return "spine";
            return "hidden";
        }
      }

      /* ------------------------------------------------------------------ *
       * Render
       * ------------------------------------------------------------------ */

      function sessions() {
        const keep = SCENARIOS.find((s) => s.id === scenario).tones;
        return live.filter((s) => keep.includes(s.tone) || s.dispatched);
      }

      function tile(s) {
        const marks = [];
        if (s.pr) marks.push(prChip(s));
        if (s.pendingReviews)
          marks.push(`<span class="badge badge-attention"><span class="badge-dot"></span>review</span>`);
        return `<div class="tile tone-${s.tone}${s.tone === "attention" ? " attention" : ""}${s.tone === "exited" ? " exited" : ""}${s.id === tookId ? " just-took" : ""}"
          data-sid="${s.id}"
          ${s.tone === "idle" ? 'ondragover="allow(event)" ondragleave="leave(event)" ondrop="drop(event)"' : ""}>
          <span class="tile-head">
            <span class="agent-dot agent-${s.agent}"></span>
            <h3>${s.name}</h3>
            ${s.gated ? `<span class="gated" title="gated by review workflow">◇</span>` : ""}
          </span>
          ${s.goal ? `<p class="tile-goal">${s.goal.text}</p>` : `<p class="tile-goal none">No goal · Codex doesn't expose prompts</p>`}
          ${s.nm ? `<span class="tile-rail">${s.nm.steps.map((st) => `<span class="${NM_TONE[st]}"></span>`).join("")}</span>` : ""}
          ${marks.length ? `<span class="tile-marks">${marks.join("")}</span>` : ""}
          <span class="drop-hint">↳ drop to dispatch here</span>
          <span class="tile-foot">
            <span class="tile-branch">${s.branch ? s.branch.replace(/^[^/]+\//, "") : s.nameSource}</span>
            <span class="spacer"></span>
            ${s.meta && s.meta.ctx != null ? `<span class="rt-ctx rt-ctx-${ctxTone(s.meta.ctx)}"><span class="rt-meter"><span class="rt-meter-fill" style="width:${s.meta.ctx}%"></span></span></span>` : ""}
            <span>${s.seen}</span>
          </span>
        </div>`;
      }

      function backlogCol() {
        return `<section class="col col-backlog">
          <header class="col-head">
            <span class="swatch"></span><h2>Backlog</h2><span class="n">${backlog.length}</span>
          </header>
          <div class="col-body">
            ${
              backlog.length
                ? backlog
                    .map(
                      (t) => `<div class="bl-card" draggable="true" data-bid="${t.id}"
                        ondragstart="lift(event)" ondragend="landed(event)">
                        <span class="bl-text">${t.text}</span>
                        <span class="bl-foot">
                          <span class="bl-repo">${t.repo}</span>
                          <span class="bl-agent">${AGENT_LABEL[t.agent]}</span>
                          <span class="grip">⠿</span>
                        </span>
                      </div>`,
                    )
                    .join("")
                : `<p class="col-empty">Backlog is empty</p>`
            }
          </div>
        </section>`;
      }

      function board() {
        const all = sessions();
        const stashed = [];
        const cols = COLS.map(([tone, label]) => {
          const items = all
            .filter((s) => s.tone === tone)
            .sort((a, b) => a.name.localeCompare(b.name));
          const mode = modeFor(tone, items.length);
          if (mode === "hidden") {
            stashed.push([tone, label]);
            return "";
          }
          const head = `<header class="col-head"><span class="swatch"></span><h2>${label}</h2><span class="n">${items.length}</span></header>`;
          if (mode === "spine") {
            return `<section class="col col-${tone} tone-${tone} spine" onclick="pop('${tone}')" title="${label} · empty - click to expand">${head}</section>`;
          }
          const body =
            mode === "allclear"
              ? `<div class="all-clear"><span class="tick">✓</span><b>All clear</b><span>Nothing is waiting on you</span></div>`
              : `<div class="col-body">${items.length ? items.map(tile).join("") : `<p class="col-empty">Nothing here</p>`}</div>`;
          return `<section class="col col-${tone} tone-${tone}${mode === "allclear" ? " calm" : ""}">${head}${body}</section>`;
        }).join("");

        const rail = stashed.length
          ? `<div class="stash">
               <span class="stash-lab">empty</span>
               ${stashed
                 .map(
                   ([tone, label]) =>
                     `<button class="tone-${tone}" onclick="restore('${tone}')" title="Show the empty ${label} column">
                        <span class="swatch"></span>${label}
                      </button>`,
                 )
                 .join("")}
             </div>`
          : "";

        return `<main class="board">${backlogCol()}${cols}${rail}</main>`;
      }

      function labBar() {
        return `<div class="lab">
            <b>Empty columns</b>
            ${TREATMENTS.map(
              (t) =>
                `<button class="${t.id === treatment ? "on" : ""}" onclick="setTreatment('${t.id}')">${t.label}${t.rec ? ` <span class="rec">rec</span>` : ""}</button>`,
            ).join("")}
            <span class="spacer"></span>
            <b>Fleet</b>
            ${SCENARIOS.map(
              (s) =>
                `<button class="${s.id === scenario ? "on" : ""}" onclick="setScenario('${s.id}')">${s.label}</button>`,
            ).join("")}
            <button onclick="reset()" title="Restore the backlog and undo any dispatches">↺ Reset</button>
          </div>`;
      }

      function caption() {
        const t = TREATMENTS.find((x) => x.id === treatment);
        return `<p class="caption"><span class="k">${t.label.split(" · ")[0]}</span><span>${t.caption}</span></p>`;
      }

      function render() {
        document.getElementById("app").innerHTML =
          `<div class="mockbar"><b>LAYOUT MOCKUP</b><a href="board.html">2 · Board</a><a class="on" href="board-columns.html">2b · Board columns</a><span class="sep"></span><a href="index.html">↩ All four</a></div>` +
          topbar("Board") +
          labBar() +
          caption() +
          board() +
          (toast
            ? `<div class="toast"><span class="dot"></span><span>${toast}</span><button onclick="reset()">Undo</button></div>`
            : "");
      }

      /* ------------------------------------------------------------------ *
       * Interaction
       * ------------------------------------------------------------------ */

      function setTreatment(id) {
        treatment = id;
        popped = new Set();
        restored = new Set();
        render();
      }
      function setScenario(id) {
        scenario = id;
        popped = new Set();
        restored = new Set();
        render();
      }
      function pop(tone) {
        popped.add(tone);
        render();
      }
      function restore(tone) {
        restored.add(tone);
        render();
      }
      function reset() {
        backlog = BACKLOG_SEED.map((t) => ({ ...t }));
        live = SESSIONS.map((s) => ({ ...s }));
        popped = new Set();
        restored = new Set();
        tookId = null;
        toast = null;
        clearTimeout(toastTimer);
        render();
      }

      function lift(e) {
        dragId = e.currentTarget.dataset.bid;
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", dragId);
        e.currentTarget.classList.add("lifting");
        // Set on the next frame so the drag image is captured before the board dims.
        requestAnimationFrame(() => document.body.classList.add("dragging"));
      }
      function landed(e) {
        e.currentTarget.classList.remove("lifting");
        document.body.classList.remove("dragging");
        dragId = null;
      }
      function allow(e) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        e.currentTarget.classList.add("drop-on");
      }
      function leave(e) {
        e.currentTarget.classList.remove("drop-on");
      }
      function drop(e) {
        e.preventDefault();
        document.body.classList.remove("dragging");
        const bid = e.dataTransfer.getData("text/plain");
        const sid = e.currentTarget.dataset.sid;
        const task = backlog.find((t) => t.id === bid);
        const s = live.find((x) => x.id === sid);
        if (!task || !s) return;
        backlog = backlog.filter((t) => t.id !== bid);
        // Dispatching an idle agent moves it out of Idle and into Working, carrying
        // the backlog item across as its goal - the whole point of the gesture.
        s.tone = "working";
        s.state = "working";
        s.goal = { text: task.text, source: "refined" };
        s.seen = "just now";
        s.dispatched = true;
        tookId = sid;
        toast = `Dispatched to <b>${s.name}</b> · ${task.text}`;
        render();
        setTimeout(() => {
          tookId = null;
          render();
        }, 1200);
        // The toast is a confirmation, not a permanent fixture - it must not sit on
        // top of the board it just changed.
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toast = null;
          render();
        }, 4200);
      }

      render();
    </script>
  </body>
</html>
