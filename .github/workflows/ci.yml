name: CI

# Exercises the repository's quality gates - typecheck, unit tests, and build -
# on every push to main and every pull request. Mirrors `make check` (typecheck +
# tests) plus a production build so a broken bundle can't merge unnoticed.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # >=24 is required (node:sqlite is used unflagged from Node 24). 24 is the
        # supported floor; 25 matches the current dev environment.
        node-version: ['24', '25']

    name: check (node ${{ matrix.node-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Full macOS app packaging. It's slow (downloads the Electron runtime + builds a
  # dmg), so it only runs for tagged releases or a manual dispatch - not every PR.
  # There are no native modules to rebuild (node:sqlite is a builtin), so this just
  # bundles + wraps with electron-builder and uploads the dmg as an artifact.
  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    name: package (macOS arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: agent-wrangler-dmg
          path: release/*.dmg
