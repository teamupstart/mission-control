name: CI

# Exercises the repository's quality gates - typecheck, tests, build, and a boot
# smoke - on every push to main and every pull request. Mirrors `make check` (typecheck
# + tests) plus a production build and a check that the built bundles actually RUN.
#
# That last step is not redundant with Build, and the comment it replaces claimed it was:
# it said a production build meant "a broken bundle can't merge unnoticed", which was
# false and shipped. `npm run build` only asserts that esbuild emitted a file. A daemon
# bundle that throws on its first line still builds, still typechecks, and still passes
# every unit test - because the tests import from `src/`, and nothing here ever ran the
# artifact. See `scripts/smoke-bundles.mjs`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Blacksmith, not `ubuntu-latest`. 4 vCPU / 16 GB is the same SHAPE as the GitHub
    # runner it replaces - deliberately, because `npm test` runs two isolated test-file
    # workers and the gates after it are sequential precisely so they don't compete for
    # that budget. The win here is faster cores and a colocated cache, not more of them;
    # widening the runner without widening the test concurrency buys only the non-test
    # gates. Blacksmith's image mirrors actions/runner-images, so `xvfb-run` and the rest
    # of the preinstalled toolchain are the same ones this job already relies on.
    #
    # NOTE: no `useblacksmith/*` action forks. Blacksmith's cache is transparent to the
    # upstream actions - `actions/setup-node`'s `cache: npm` below already lands on it -
    # and the forks (`useblacksmith/setup-node`, `useblacksmith/cache`) are archived
    # upstream. Pinning one would be adopting an unmaintained action for no cache gain.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # >=24 is required (node:sqlite is used unflagged from Node 24). Test the
        # supported floor and the current release. Node 25 is EOL.
        node-version: ['24', '26']

    name: check (node ${{ matrix.node-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Electron 42+ downloads its runtime on first use instead of during npm install.
      # Provision it explicitly so GUI fixtures only exercise the application under test.
      - name: Install Electron test runtime
        run: npm exec -- install-electron --no

      - name: Typecheck
        run: npm run typecheck

      # `npm test` runs two isolated test files at a time. Keeping the remaining gates
      # sequential avoids competing with those workers for the runner's CPU and memory.
      - name: Test
        run: xvfb-run -a npm test

      - name: Build
        run: npm run build

      # Runs the bundles Build just produced. Ordered after it because it needs `dist/`.
      - name: Smoke the built bundles
        run: npm run smoke

      # Browser-level end-to-end tests. Runs after Build because it drives the BUILT
      # dashboard served by the BUILT daemon - `dist/web` and `dist/server/index.mjs` both
      # have to exist, which is also why this suite lives in `e2e/` and not `test/`.
      #
      # Gated to one Node version rather than the matrix. The matrix exists to pin the
      # `node:sqlite` floor and the current release for the DAEMON; the browser layer gains
      # nothing from being run twice, and this is the slowest gate on the PR path.
      #
      # No model tokens are spent: `e2e/fixtures/fake-agents.ts` points every
      # `MISSION_*_BIN` at a local fake, and nothing in `src/` reaches a model API by any
      # other route. See that file for why that is a property of the daemon, not a hope.
      - name: Install Playwright browser
        if: matrix.node-version == '24'
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        if: matrix.node-version == '24'
        run: npm run test:e2e

      - name: Upload e2e report
        if: failure() && matrix.node-version == '24'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Full macOS app packaging. It's slow (downloads the Electron runtime + builds a
  # dmg), so it only runs for tagged releases or a manual dispatch - not every PR.
  # There are no native modules to rebuild (node:sqlite is a builtin), so this just
  # bundles + wraps with electron-builder and uploads the dmg as an artifact.
  #
  # Stays on the GitHub-hosted macOS runner while `check` moves to Blacksmith, and the
  # asymmetry is deliberate: this job is off the PR path, so it is not where CI latency
  # is felt, and Blacksmith's macOS runners are billed per minute outside the free
  # allowance. Blacksmith also publishes no macos-14 image, so moving it would silently
  # bump the OS the shipped dmg is built on - a release-artifact change wearing a CI
  # change's clothes.
  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    name: package (macOS arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-dmg
          path: release/*.dmg
