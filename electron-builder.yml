# electron-builder config for the macOS (Apple Silicon) desktop build.
#
# The app is fully self-contained from the esbuild bundles under dist/ - the
# daemon, UI, MCP server, and hook bridge each inline their JS deps, and
# node:sqlite is a builtin - so no node_modules ship at runtime.
#
# asar is OFF on purpose: Claude Code launches the satellite scripts
# (dist/satellites/hook.mjs, dist/mcp/server.mjs) with an EXTERNAL node that
# can't read inside an asar archive, so they must be plain files on disk.
appId: com.fleet-control.app
productName: Agent Wrangler
copyright: Agent Wrangler

asar: false

directories:
  output: release
  buildResources: build

# Only the built bundles + the tray image + package.json (for "main"/version).
# node_modules are intentionally excluded: every runtime dep is inlined by esbuild
# into the dist bundles, and node:sqlite is a builtin, so nothing under
# node_modules is needed at runtime. This keeps the app ~275MB smaller.
files:
  - dist/**/*
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - package.json
  - "!node_modules/**/*"

mac:
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Local, unsigned/ad-hoc build (this Mac only). electron-builder applies an
  # ad-hoc signature so the arm64 binary can execute; no notarization.
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: Agent Wrangler
