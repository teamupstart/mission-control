name: Release

# Release Please owns this repository's version, changelog, tag, and GitHub Release.
#
# Why this exists at all: the packaged app compares its own `package.json` version against the
# newest stable GitHub Release to decide whether an update is available. Before this workflow
# the version had been 0.1.0 since the first commit and no tag, changelog, or Release had ever
# existed, so there was nothing to compare against.
#
# How it works: every push to the default branch updates (or opens) a single release pull
# request that bumps `package.json`, `package-lock.json`, and a GENERATED `CHANGELOG.md` from
# the conventional-commit squash titles merged since the last release. Merging that pull
# request is the release: the next run of this workflow sees the release commit, creates the
# `vX.Y.Z` tag, and publishes the GitHub Release.
#
# Release Please treats an unparseable commit as omitted input, not an error. The validator below
# checks each first-parent commit added by this push before minting a write token, so a title that
# would turn the workflow into a successful no-op is a loud failure instead.
#
# `.release-please-manifest.json` is bootstrapped at 0.1.0 - the version already in
# `package.json` - rather than left for the action to infer, because there is no tag history to
# infer it from and an invented first version would not match the shipped app.
#
# Release Please uses a short-lived installation token minted for the `mission-control-release`
# GitHub App instead of GITHUB_TOKEN. The organization policy prevents GitHub Actions' default
# token from opening pull requests. The App is installed only on this repository with contents,
# issues, and pull-request write access.
#
# Two things this deliberately does NOT do:
#
#   * It does not publish to npm. The package is private and the artifact is a macOS app built
#     on the user's own machine.
#   * It does not attach a dmg to the GitHub Release. Because the release tag is pushed with the
#     installation token above, it starts `ci.yml` and that workflow's `package` job builds
#     the dmg as a separate release check. The dmg remains a 90-day Actions artifact.
#
# `CHANGELOG.md` is generated. Never hand-edit it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release in flight: a cancelled run can leave the tag pushed and the Release
# unpublished, which is exactly the state the updater cannot read.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    name: release-please
    steps:
      - name: Check out the release input
        uses: actions/checkout@v5
        with:
          # The push range can contain several rebased commits. Full history lets the validator
          # walk exactly that first-parent range instead of guessing from a shallow checkout.
          fetch-depth: 0

      - name: Assert Release Please can parse the new commits
        # workflow_dispatch is the explicit recovery path for a merged pull request whose body
        # contains Release Please's BEGIN_COMMIT_OVERRIDE block. It has no push range to validate,
        # so let Release Please consume that override instead of re-rejecting the bad head subject.
        if: ${{ github.event_name == 'push' }}
        env:
          RELEASE_BASE_SHA: ${{ github.event.before }}
          RELEASE_HEAD_SHA: ${{ github.sha }}
        run: node scripts/assert-release-commit.mjs

      - name: Mint the mission-control-release installation token
        id: release-app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Open or update the release pull request, and release when one is merged
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.release-app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The version equality the updater depends on, checked against the tag that was actually
      # created rather than against the pull request that proposed it. This runs after the
      # Release exists, so it is a loud failure rather than a gate - the same assertion also
      # runs in `ci.yml`'s `package` job, which is where it blocks an artifact.
      - name: Check out the released tag
        if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Assert the tag, package.json, and lockfile agree
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: node scripts/assert-release-version.mjs "$TAG"
