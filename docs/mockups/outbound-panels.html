<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inspector + Shipping - panel redesign mockups</title>
<style>
:root{
  color-scheme: dark;
  --bg:#0a0c0f; --bg-2:#0e1116; --panel:#14181e; --panel-2:#171c23;
  --border:#232a33; --border-soft:#1b2129;
  --fg:#e7ebf1; --muted:#939eae; --dim:#7c8798;
  --working:#4a9eff; --idle:#35c08a; --attention:#f6a733; --danger:#f85149;
  --exited:#707a88; --neutral:#8b94a3; --purple:#a371f7; --pr-merged:var(--purple);
  --radius:13px;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.28);
  --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,monospace;
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;-webkit-font-smoothing:antialiased}
h2,h3,h4,p,ul,ol{margin:0}
code{font-family:var(--mono);font-size:.92em;color:var(--muted)}
button{font:inherit}

/* ---------- mockup harness chrome (not part of the design) ---------- */
.harness-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:12px 22px;background:rgba(10,12,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.harness-title{font-size:12px;font-weight:640;letter-spacing:-.01em}
.harness-title span{color:var(--dim);font-weight:450}
.seg{display:inline-flex;padding:3px;gap:3px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.seg button{padding:5px 12px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:560;cursor:pointer;transition:.14s}
.seg button:hover{color:var(--fg)}
.seg button.on{background:color-mix(in oklab,var(--working) 18%,transparent);color:var(--fg);box-shadow:inset 0 0 0 1px color-mix(in oklab,var(--working) 34%,var(--border))}
.harness-key{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim);letter-spacing:.04em}

.rationale{margin:0 auto;max-width:1400px;padding:16px 22px 0}
.rationale-in{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border:1px dashed var(--border);border-radius:10px;background:var(--panel-2)}
.rationale-tag{flex:none;font-family:var(--mono);font-size:9.5px;font-weight:640;letter-spacing:.09em;text-transform:uppercase;
  color:var(--purple);border:1px solid color-mix(in oklab,var(--purple) 40%,var(--border));border-radius:20px;padding:3px 9px}
.rationale p{font-size:11.5px;line-height:1.6;color:var(--muted)}
.rationale strong{color:var(--fg);font-weight:600}

/* ---------- settings page shell (existing app) ---------- */
.settings-page{display:flex;align-items:stretch;max-width:1400px;width:100%;margin:0 auto;padding-bottom:80px}
.settings-rail{flex:0 0 232px;display:flex;flex-direction:column;gap:2px;align-self:flex-start;position:sticky;top:70px;
  padding:14px 12px 20px;border-right:1px solid var(--border-soft)}
.settings-nav-label{display:flex;align-items:center;gap:4px 7px;margin:13px 6px 4px;font-family:var(--mono);font-size:9px;
  font-weight:640;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
.settings-nav-group:first-child .settings-nav-label{margin-top:2px}
.settings-nav-label .settings-scope{margin-left:auto}
.settings-scope{display:inline-flex;align-items:center;padding:2px 7px;border:1px solid var(--border);border-radius:20px;
  font-family:var(--mono);font-size:9px;font-weight:640;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.settings-scope-browser{color:var(--working);border-color:color-mix(in oklab,var(--working) 40%,var(--border));background:color-mix(in oklab,var(--working) 9%,transparent)}
.settings-scope-machine{color:var(--idle);border-color:color-mix(in oklab,var(--idle) 40%,var(--border));background:color-mix(in oklab,var(--idle) 9%,transparent)}
.settings-scope-home{color:var(--attention);border-color:color-mix(in oklab,var(--attention) 45%,var(--border));background:color-mix(in oklab,var(--attention) 9%,transparent)}
.settings-scope-github{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 45%,var(--border));background:color-mix(in oklab,var(--danger) 9%,transparent)}
.settings-nav-item{display:flex;align-items:center;gap:9px;width:100%;padding:8px 11px;font-size:12.5px;font-weight:540;color:var(--muted);
  text-align:left;background:transparent;border:1px solid transparent;border-radius:8px;cursor:pointer;transition:.14s}
.settings-nav-item:hover{background:var(--panel);color:var(--fg)}
.settings-nav-item.is-active{background:color-mix(in oklab,var(--working) 14%,transparent);
  border-color:color-mix(in oklab,var(--working) 30%,var(--border));color:var(--fg);font-weight:600}
.settings-nav-icon{flex:none;width:18px;font-size:14px;line-height:1;text-align:center;color:var(--dim)}
.settings-nav-item.is-active .settings-nav-icon{color:var(--fg)}
/* A settings form is a reading column, not a billboard: capped so a label and its control
   stay in one eye movement. The ops-console variant opts out, because its right half is a
   table that earns the width. */
.settings-pane{flex:1 1 auto;min-width:0;max-width:1040px;padding:16px 26px 0 26px}
.settings-pane.wide{max-width:none}
.settings-panel-head{display:flex;align-items:center;gap:12px;margin:0 0 16px;padding-bottom:10px;border-bottom:1px solid var(--border-soft)}
.settings-panel-head h2{font-size:17px;font-weight:650;letter-spacing:-.01em}
.settings-panel-head .settings-scope{margin-left:auto}
.settings-hint{font-size:11.5px;line-height:1.6;color:var(--dim)}
.settings-group-label{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.link{padding:0;border:0;background:transparent;color:var(--working);font:inherit;font-size:11.5px;cursor:pointer}
.link:hover{text-decoration:underline}

/* ---------- shared new primitives ---------- */
.switch{position:relative;flex:none;width:38px;height:22px;border-radius:999px;background:var(--panel-2);
  border:1px solid var(--border);cursor:pointer;transition:.16s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:var(--exited);transition:.16s}
.switch.on{background:color-mix(in oklab,var(--danger) 26%,var(--panel-2));border-color:color-mix(in oklab,var(--danger) 55%,var(--border))}
.switch.on::after{left:18px;background:var(--danger)}
.switch.on.safe{background:color-mix(in oklab,var(--idle) 24%,var(--panel-2));border-color:color-mix(in oklab,var(--idle) 50%,var(--border))}
.switch.on.safe::after{background:var(--idle)}

.dot{flex:none;width:7px;height:7px;border-radius:999px;background:var(--exited)}
.dot.ok{background:var(--idle);box-shadow:0 0 0 3px color-mix(in oklab,var(--idle) 16%,transparent)}
.dot.warn{background:var(--attention);box-shadow:0 0 0 3px color-mix(in oklab,var(--attention) 16%,transparent)}
.dot.bad{background:var(--danger);box-shadow:0 0 0 3px color-mix(in oklab,var(--danger) 16%,transparent)}
.dot.live{background:var(--working);box-shadow:0 0 0 3px color-mix(in oklab,var(--working) 16%,transparent)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:20px;border:1px solid var(--border);
  background:var(--panel-2);font-size:10.5px;color:var(--muted);white-space:nowrap}
.chip.mono{font-family:var(--mono);font-size:10px}
.chip.ok{color:var(--idle);border-color:color-mix(in oklab,var(--idle) 38%,var(--border));background:color-mix(in oklab,var(--idle) 10%,transparent)}
.chip.warn{color:var(--attention);border-color:color-mix(in oklab,var(--attention) 40%,var(--border));background:color-mix(in oklab,var(--attention) 10%,transparent)}
.chip.bad{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 40%,var(--border));background:color-mix(in oklab,var(--danger) 10%,transparent)}
.chip.merged{color:var(--pr-merged);border-color:color-mix(in oklab,var(--pr-merged) 40%,var(--border));background:color-mix(in oklab,var(--pr-merged) 10%,transparent)}

.field{padding:5px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg-2);color:var(--fg);
  font-size:12px;font-family:var(--sans)}
.field.mono{font-family:var(--mono);font-size:11.5px}
select.field{appearance:none;padding-right:26px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 14px) 11px,calc(100% - 9px) 11px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}

.pillbar{display:inline-flex;padding:3px;gap:3px;background:var(--bg-2);border:1px solid var(--border);border-radius:9px}
.pillbar button{padding:5px 13px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-size:11.5px;font-weight:560;cursor:pointer}
.pillbar button.on{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.4)}
.pillbar button.on.danger{color:color-mix(in oklab,var(--danger) 80%,var(--fg));box-shadow:0 1px 2px rgba(0,0,0,.4),inset 0 0 0 1px color-mix(in oklab,var(--danger) 40%,transparent)}

/* ============================================================= */
/*  VARIANT A - Posture card                                      */
/* ============================================================= */
.posture{display:flex;align-items:flex-start;gap:14px;padding:16px 18px;border-radius:var(--radius);
  border:1px solid color-mix(in oklab,var(--danger) 30%,var(--border));
  background:linear-gradient(180deg,color-mix(in oklab,var(--danger) 9%,var(--panel)) 0%,var(--panel) 100%);
  box-shadow:var(--shadow)}
.posture.is-off{border-color:var(--border);background:var(--panel)}
.posture.is-dry{border-color:color-mix(in oklab,var(--attention) 28%,var(--border));
  background:linear-gradient(180deg,color-mix(in oklab,var(--attention) 8%,var(--panel)) 0%,var(--panel) 100%)}
.posture-mark{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:10px;
  border:1px solid var(--border);background:var(--bg-2);font-size:15px;color:var(--muted)}
.posture.is-live .posture-mark{color:var(--danger);border-color:color-mix(in oklab,var(--danger) 40%,var(--border))}
.posture-body{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:5px}
.posture-line{font-size:14.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.posture-line em{font-style:normal;color:var(--danger)}
.posture-sub{font-size:11.5px;line-height:1.6;color:var(--dim)}
.posture-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.posture-switch{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none;padding-left:6px}
.posture-switch span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

.setgroup{margin-top:22px}
.setgroup > .settings-group-label{margin-bottom:8px}
.setcard{border:1px solid var(--border);border-radius:11px;background:var(--panel);overflow:hidden}
.setrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:14px 16px;border-top:1px solid var(--border-soft)}
.setrow:first-child{border-top:0}
.setrow-label{display:flex;flex-direction:column;gap:3px}
.setrow-label b{font-size:12.5px;font-weight:580}
.setrow-label small{font-size:11px;line-height:1.55;color:var(--dim);max-width:56ch}
.setrow-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end;max-width:420px}
.setrow-ctl .settings-hint{flex-basis:100%;text-align:right}
.setrow.stack{grid-template-columns:1fr}
.setrow.stack .setrow-ctl{justify-content:flex-start}

.blockers{margin-top:14px;border:1px solid color-mix(in oklab,var(--attention) 30%,var(--border));border-radius:11px;
  background:color-mix(in oklab,var(--attention) 7%,var(--panel));overflow:hidden}
.blockers-head{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12px;font-weight:600;
  color:color-mix(in oklab,var(--attention) 82%,var(--fg));border-bottom:1px solid color-mix(in oklab,var(--attention) 20%,transparent)}
.blockers li{display:flex;align-items:center;gap:9px;padding:9px 14px;font-size:11.5px;line-height:1.5;color:var(--muted);
  border-top:1px solid color-mix(in oklab,var(--attention) 12%,transparent)}
.blockers li:first-child{border-top:0}
.blockers li .link{margin-left:auto;white-space:nowrap}
.blockers ul{list-style:none;padding:0}
.blockers li .glyph{flex:none;width:14px;text-align:center;color:var(--attention)}

/* ledger, shared by A + B */
.ledger{margin-top:22px}
.ledger-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.ledger-head .settings-group-label{margin-right:auto}
.ledger-counts{display:flex;gap:6px}
.ltable{border:1px solid var(--border);border-radius:11px;background:var(--panel);overflow:hidden}
.lrow{display:grid;grid-template-columns:1fr auto 92px;gap:12px;align-items:center;padding:9px 14px;border-top:1px solid var(--border-soft);font-size:12px}
.lrow:first-child{border-top:0}
.lrow:hover{background:var(--panel-2)}
.lrow.retired{opacity:.55}
.lrow a{color:var(--fg);text-decoration:none;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow a:hover{text-decoration:underline}
.lrow .when{color:var(--dim);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.lrow .pr{display:flex;align-items:center;gap:8px;min-width:0}
.lrow .title{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ============================================================= */
/*  VARIANT B - Gate pipeline                                     */
/* ============================================================= */
.pipe{margin-top:16px;border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.pipe-head{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--panel-2);border-bottom:1px solid var(--border)}
.pipe-head h3{font-size:13px;font-weight:620}
.pipe-head .settings-hint{margin-top:2px}
.pipe-head .switch{margin-left:auto}
.step{position:relative;display:grid;grid-template-columns:26px 1fr;gap:14px;padding:15px 16px 15px 14px;border-top:1px solid var(--border-soft)}
.step:first-of-type{border-top:0}
.step-mark{position:relative;display:flex;justify-content:center;padding-top:3px}
.step-mark .ring{width:16px;height:16px;border-radius:999px;border:2px solid var(--border);background:var(--bg-2);display:grid;place-items:center;
  font-size:9px;color:var(--dim);z-index:1}
.step.on .ring{border-color:var(--idle);color:var(--idle)}
.step.blocked .ring{border-color:var(--attention);color:var(--attention)}
.step.off .ring{border-color:var(--exited)}
.step-mark::after{content:"";position:absolute;top:20px;bottom:-22px;width:2px;background:var(--border-soft)}
.step:last-of-type .step-mark::after{display:none}
.step.on .step-mark::after{background:color-mix(in oklab,var(--idle) 40%,var(--border-soft))}
.step-body{display:flex;flex-direction:column;gap:7px;min-width:0}
.step-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.step-title{font-size:12.5px;font-weight:580}
.step-title small{margin-left:8px;font-weight:450;color:var(--dim);font-size:11px}
.step-top .ctl{margin-left:auto;display:flex;align-items:center;gap:9px}
.step-note{font-size:11.5px;line-height:1.6;color:var(--dim);max-width:74ch}
.step-note b{color:var(--muted);font-weight:560}
.step.blocked .step-note{color:color-mix(in oklab,var(--attention) 70%,var(--muted))}
.step.foreign{background:repeating-linear-gradient(135deg,transparent 0 8px,rgba(255,255,255,.012) 8px 16px)}
.step-owner{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
  border:1px solid var(--border);border-radius:20px;padding:2px 7px}
.pipe-out{display:flex;align-items:center;gap:10px;padding:13px 16px;border-top:1px solid var(--border);background:var(--panel-2);font-size:12px}
.pipe-out b{font-weight:600}
.pipe-out .chip{margin-left:auto}

/* ============================================================= */
/*  VARIANT C - Operations console                                */
/* ============================================================= */
.split{display:grid;grid-template-columns:minmax(330px,360px) minmax(0,1fr);gap:22px;align-items:start;margin-top:4px}
.cpanel{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.cpanel + .cpanel{margin-top:14px}
.cpanel-head{display:flex;align-items:center;gap:9px;padding:11px 14px;border-bottom:1px solid var(--border-soft);background:var(--panel-2)}
.cpanel-head h4{font-family:var(--mono);font-size:9.5px;font-weight:640;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.cpanel-head .switch{margin-left:auto}
.cpanel-body{padding:13px 14px;display:flex;flex-direction:column;gap:13px}
.cfield{display:flex;flex-direction:column;gap:6px}
.cfield-top{display:flex;align-items:center;gap:8px}
.cfield-top label{font-size:12px;font-weight:560}
.cfield-top .ctl{margin-left:auto}
.cfield small{font-size:11px;line-height:1.5;color:var(--dim)}
.cstate{display:flex;align-items:center;gap:9px;padding:11px 14px;font-size:12px;font-weight:560;
  border-bottom:1px solid var(--border-soft)}
.cstate.live{color:color-mix(in oklab,var(--danger) 78%,var(--fg));background:color-mix(in oklab,var(--danger) 10%,transparent)}
.cstate.armed{color:color-mix(in oklab,var(--attention) 80%,var(--fg));background:color-mix(in oklab,var(--attention) 9%,transparent)}

.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.stat{padding:11px 13px;border:1px solid var(--border);border-radius:10px;background:var(--panel)}
.stat b{display:block;font-size:20px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{display:block;margin-top:3px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.stat.attn b{color:var(--attention)} .stat.bad b{color:var(--danger)} .stat.ok b{color:var(--idle)} .stat.mg b{color:var(--pr-merged)}

.tbl{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.tbl-head{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--panel-2)}
.tbl-head h4{font-size:12px;font-weight:600;margin-right:auto}
.tbl-filter{display:inline-flex;gap:2px;padding:2px;background:var(--bg-2);border:1px solid var(--border);border-radius:7px}
.tbl-filter button{padding:3px 9px;border:0;border-radius:5px;background:transparent;color:var(--dim);font-size:10.5px;cursor:pointer}
.tbl-filter button.on{background:var(--panel);color:var(--fg)}
.trow{display:grid;grid-template-columns:170px 1fr 150px 104px;gap:12px;align-items:center;padding:10px 14px;
  border-top:1px solid var(--border-soft);font-size:12px}
.trow.head{border-top:0;padding:7px 14px;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);background:var(--bg-2)}
.trow:hover:not(.head){background:var(--panel-2)}
.trow a{color:var(--fg);text-decoration:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow a:hover{text-decoration:underline}
.trow .t{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .w{color:var(--dim);font-size:11px;text-align:right;font-variant-numeric:tabular-nums}
.trow.retired{opacity:.5}
.progress{position:relative;height:4px;border-radius:999px;background:var(--bg-2);overflow:hidden;width:74px}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--attention)}
.soakcell{display:flex;align-items:center;gap:8px;color:var(--attention);font-size:11px;white-space:nowrap}

.repochips{display:flex;flex-wrap:wrap;gap:6px}
.hidden{display:none}
</style>
</head>
<body>

<div class="harness-top">
  <div class="harness-title">Panel redesign mockups <span>· Inspector &amp; Shipping · same tokens, same copy contracts</span></div>
  <div class="seg" id="panelSeg">
    <button data-panel="inspector" class="on">Inspector</button>
    <button data-panel="shipping">Shipping</button>
  </div>
  <div class="seg" id="variantSeg">
    <button data-variant="a" class="on">A · Posture card</button>
    <button data-variant="b">B · Gate pipeline</button>
    <button data-variant="c">C · Ops console</button>
  </div>
  <div class="harness-key">mockup - nothing here is wired</div>
</div>

<div class="rationale"><div class="rationale-in">
  <span class="rationale-tag" id="ratTag">A</span>
  <p id="ratText"></p>
</div></div>

<div class="settings-page">
  <aside class="settings-rail">
    <div class="settings-nav-group">
      <div class="settings-nav-label">This screen <span class="settings-scope settings-scope-browser">This browser</span></div>
      <button class="settings-nav-item"><span class="settings-nav-icon">▦</span>Display</button>
      <button class="settings-nav-item"><span class="settings-nav-icon">⌨</span>Keyboard</button>
    </div>
    <div class="settings-nav-group">

        <span class="step-title">7 · Afterwards<small>fires on any merge, including yours</small></span>
        <div class="ctl"><span style="font-size:11.5px;color:var(--muted)">close the session</span><button class="switch on safe" aria-label="close session after merge"></button></div>
      </div>
      <p class="step-note">The task is marked complete either way - it never gets Kill's failed outcome. This decides only whether the finished agent stays: closing it frees a fleet slot and reclaims the checkout when it holds nothing uncommitted; keeping it lets the autopilot hand it the next task in place, context and all.</p>
    </div>
  </div>

  <div class="pipe-out">
    <span class="dot warn"></span><b>Right now:</b> 1 pull request is soaking, 2 are held at a gate, 1 can never merge. <span class="chip warn">see below</span>
  </div>
</div>

<div class="ledger">
  <div class="ledger-head">
    <p class="settings-group-label">Where each pull request stands</p>
    <div class="ledger-counts"><span class="chip warn">1 soaking</span><span class="chip">2 waiting</span><span class="chip merged">1 merged</span></div>
  </div>
  <div class="ltable">
    ${PRS.map(p=>`
    <div class="lrow${p.retired&&p.shipTone!=='merged'?' retired':''}">
      <div class="pr"><a href="#">${p.repo}#${p.n}</a><span class="title">${p.title}</span></div>
      <span class="chip ${p.shipTone}">${p.ship}</span>
      <span class="when">${p.when}</span>
    </div>`).join("")}
  </div>
</div>`;

/* ------------------------------------------------------------------ */
const VIEWS = {
  inspector:{a:inspectorA,b:inspectorB,c:inspectorC},
  shipping:{a:shippingA,b:shippingB,c:shippingC},
};
let panel="inspector", variant="a";
function render(){
  const pane = document.getElementById('pane');
  pane.className = 'settings-pane' + (variant === 'c' ? ' wide' : '');
  pane.innerHTML = VIEWS[panel][variant]();
  document.getElementById('ratTag').textContent = variant.toUpperCase();
  document.getElementById('ratText').innerHTML = RATIONALE[variant];
  document.getElementById('railInspector').classList.toggle('is-active', panel==='inspector');
  document.getElementById('railShipping').classList.toggle('is-active', panel==='shipping');
  document.querySelectorAll('#panelSeg button').forEach(b=>b.classList.toggle('on', b.dataset.panel===panel));
  document.querySelectorAll('#variantSeg button').forEach(b=>b.classList.toggle('on', b.dataset.variant===variant));
}
document.getElementById('panelSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; panel=b.dataset.panel; render();
});
document.getElementById('variantSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return; variant=b.dataset.variant; render();
});
document.getElementById('railInspector').addEventListener('click',()=>{panel='inspector';render()});
document.getElementById('railShipping').addEventListener('click',()=>{panel='shipping';render()});
document.addEventListener('keydown',e=>{
  if(e.key==='1'||e.key==='2'||e.key==='3'){variant=['a','b','c'][+e.key-1];render()}
  if(e.key==='i'){panel='inspector';render()} if(e.key==='s'){panel='shipping';render()}
});
/* mockup switches are inert except for their own visual state */
document.addEventListener('click',e=>{
  const s=e.target.closest('.switch'); if(s){s.classList.toggle('on');}
  const p=e.target.closest('.pillbar button, .tbl-filter button');
  if(p){[...p.parentElement.children].forEach(c=>c.classList.remove('on')); p.classList.add('on');}
});
render();
</script>
