    <link rel="stylesheet" href="theme.css" />
    <style>
      /*
       * IDLE, BUT HELD BY A RUNNING WORKFLOW - four treatments.
       *
       * WHAT IS ACTUALLY WRONG (this is not what it first looks like)
       *
       * The TILE is already fine. `SessionTile` mounts `WorkflowLadderPanel`, so a board
       * tile bound to a run already draws the peek reproduced below verbatim: the
       * workflow name, its version, the run state ("Reviewing"), the round counter, the
       * consequential rung, that rung's members, and a sentence. It even has a disclosure
       * that expands the full Stage Ladder in place. Nothing about "show the workflow on
       * the tile" is missing - it shipped.
       *
       * What lies is the BOARD around it:
       *
       *   1. THE COLUMN. `stateDisplay(session)` reads a Session and nothing else, so it
       *      says `idle` - correctly, the agent did finish its turn. The board files it
       *      under `idle` beside agents that are genuinely free.
       *   2. THE COUNT. "5" in the idle column header, and "idle" in the topbar. Two of
       *      those five can take work. That is the number every dispatch decision reads.
       *   3. THE DROP TARGET - and this one is not cosmetic. `canAcceptTask`
       *      (BacklogColumn.tsx:409) is:
       *
       *          if (!repoRoot) return false;
       *          if (!session.instrumented) return false;
       *          if (stateDisplay(session).tone !== "idle") return false;
       *          return session.repoRoot != null && session.repoRoot === repoRoot;
       *
       *      It knows nothing about workflow runs. So a session held mid-run LIGHTS UP as
       *      a drop target during a backlog drag, and the drop calls
       *      `api.assignTask(id, session.id, true)` - reset true. You can hand a backlog
       *      task to an agent a No-Mistakes run is in the middle of, and reset it.
       *      "Nothing can be done" understates it: the one thing the board actively
       *      invites you to do is the one thing that breaks the run.
       *
       * Turn on "Simulate a backlog drag" below to see which treatments fix #3. Only one
       * does, and it is worth knowing which - see the note under treatment D.
       *
       * WHAT ALL FOUR NEED
       * Held-ness is a JOIN: a `WorkflowRunSummary` whose `sessionId` is this session and
       * whose `status` passes `workflowRunIsOpen()`. `App.tsx` already builds exactly that
       * map (`workflowRunBySession`) and hands it to the tile. The work is threading it
       * into the board's GROUPING and into `canAcceptTask` - not new plumbing.
       *
       * Markup and class names below are the shipping ones (`.board-col`, `.tile`,
       * `.wf-tile-peek`, `.tile-drop-hint`), and the CSS is lifted from styles.css, so
       * the only new thing in each treatment is what that treatment adds.
       */

      :root {
        /* styles.css moved --dim to #7c8798; theme.css has drifted. Overridden locally
           rather than fixed in theme.css, which would restyle sibling mockups. */
        --dim: #7c8798;
        --select: #35c08a;
        --purple: #a371f7;
        /* The held tone. Not --working blue: that is the RUN's colour and already means a
           running workflow (`.workflow-running`). Not --idle green: that is the "free,
           take me" colour this page exists to protect. Not a cyan: ~28 degrees off
           --idle green is illegible at 7px, and idle-vs-held is the exact distinction
           that has to survive a glance. Purple is far from both, and is NOT a new token -
           styles.css ships --purple. Its honest cost: it already means --foreman,
           --pr-merged and --cost. All three are small footer marks; --tone-color (spine,
           swatch, column head) has no purple member today. */
        --held: var(--purple);
      }
      .tone-held {
        --tone-color: var(--held);
      }

      /* ---- the workflow peek, verbatim from styles.css. THIS ALREADY SHIPS. ---- */
      .wf-tile-peek {

        margin: 0;
        padding: 0 3px;
        font-size: 10px;
        line-height: 1.45;
        color: var(--dim);
      }

      /* C - the refusal. The tile does not light up, and says why where the
         drop hint would have been. */
      .tile.is-refused {
        border-color: color-mix(in oklab, var(--held) 34%, var(--border));
        opacity: 0.72;
      }
      .tile-drop-refused {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 10.5px;
        font-weight: 650;
        color: var(--held);
      }
      .peek-held-line {
        margin: 6px 0 0;
        font-size: 9.5px;
        line-height: 1.45;
        color: var(--held);
      }

      body.dragging .board-backlog {
        border-color: color-mix(in oklab, var(--select) 40%, var(--border));
      }
    </style>
  </head>
  <body>
    <div class="mockbar">
      <b>MOCKUP</b>
      <span>Idle, but held by a running workflow</span>
      <span class="sep"></span>
      <a href="index.html">← all mockups</a>
      <a href="board-columns.html">board columns</a>
      <a href="workflow-bind-affordance.html">workflow bind</a>
    </div>

    <div id="app">
      <div class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <h1>Mission Control</h1>
          <span class="layout-tag">Board</span>
        </div>
        <div class="filter-box">
          <span class="filter-icon">⌕</span>
          <input class="filter-input" placeholder="Filter sessions" />
        </div>
        <div class="summary">
          <span class="stat"><span class="stat-n">9</span><span class="stat-label">sessions</span></span>
          <span class="stat stat-attention"><span class="stat-n">1</span><span class="stat-label">needs you</span></span>
          <span class="stat stat-working"><span class="stat-n">2</span><span class="stat-label">working</span></span>
          <span class="stat" id="capacity-stat"></span>
        </div>
        <span style="flex: 1"></span>
        <button class="ghost-btn">Roundup <span class="ghost-badge">3</span></button>
        <button class="dispatch-btn">Dispatch</button>
        <span class="link"><span class="link-dot"></span>live</span>
      </div>

      <div class="lab">
        <b>Treatment</b>
        <button data-t="count"><span class="k">A</span>Honest column count</button>
        <button data-t="split"><span class="k">B</span>Section the idle column</button>
        <button data-t="refuse"><span class="k">C</span>Refuse the drop</button>
        <button data-t="column"><span class="k">D</span>New “held” column</button>
        <span class="spacer"></span>
        <button class="drag" id="drag-toggle">◇ Simulate a backlog drag</button>
      </div>

      <div class="caption">
        <span class="k" id="cap-k">A</span>
        <p id="cap-body"></p>
        <div class="tradeoffs" id="cap-tradeoffs"></div>
      </div>

      <div class="board" id="board"></div>
    </div>

    <script>
      // Agent accents, verbatim from AGENT_IDENTITY (src/shared/agent.ts). styles.css
      // deliberately contains no per-agent colour; it arrives as inline --agent-accent.
      const ACCENT = { claude: "#d97757", codex: "#10a37f", pi: "#4d7cfe" };

      // The peek content is what `workflowLadderPeekView` would project for these runs:
      // the consequential rung, its members, and the run header.
      const FLEET = [
        {
          id: "s1",
          name: "Codex sandbox escape prompt",
          agent: "claude",
          tone: "attention",
          goal: "Decide whether the seatbelt profile should allow the tmux control socket",
          branch: "harness/sandbox-prompt",
          seen: "2m",
          model: "Opus 4.6",
          ctx: 31,
          mode: "accept edits",
          cost: "≈$0.41",
          marks: [{ cls: "tf-review", text: "review" }],
        },
        {
          id: "s2",
          name: "Migrate Electron shell to 43",
          agent: "claude",
          tone: "working",
          goal: "Port the BrowserWindow geometry tests off the removed remote module",
          branch: "harness/electron-43",
          seen: "just now",
          model: "Sonnet 4.6",
          ctx: 62,
          mode: "accept edits",
          cost: "≈$1.12",
          activity: "Editing src/electron/window.ts",
        },
        {
          id: "s3",
          name: "Backlog autopilot retry budget",
          agent: "codex",
          tone: "working",
          goal: "Cap repair retries per task rather than per run, so one bad task cannot starve the queue",
          branch: "harness/retry-budget",
          seen: "just now",
          model: "GPT-5.6",
          ctx: 18,
          mode: "approve",
          cost: "≈$0.63",
          activity: "Running npm test",
        },

        // ---- idle, and held by an open run ----
        {
          id: "s4",
          name: "Fix workflow graph view sizing",
          agent: "codex",
          runtime: "sdk",
          tone: "idle",
          goal: "The run graph clips its last rung below 1280px and the ladder overflows its card",
          branch: "harness/graph-sizing",
          seen: "28m",
          model: "GPT-5.6 Sol",
          ctx: 45,
          mode: "approve",
          cost: "≈$2.55",
          marks: [{ cls: "pr-open", text: "#241" }],
          run: {
            name: "No-Mistakes Review",
            v: 8,
            state: "Reviewing",
            tone: "running",
            round: 1,
            max: 5,
            rung: "Stage 1",
            sub: "2 checks · all must pass",
            rungState: "Running",
            members: [
              { tone: "passed", glyph: "✓", name: "Check · typecheck" },
              { tone: "running", glyph: "●", name: "Check · test" },
            ],
          },
        },
        {
          id: "s5",
          name: "Board drill-in keyboard nav",
          agent: "claude",
          tone: "idle",
          goal: "Arrow keys skip the stashed columns, so ← from working lands nowhere",
          branch: "harness/board-drillin-keys",
          seen: "6m",
          model: "Sonnet 4.6",
          ctx: 71,
          mode: "accept edits",
          cost: "≈$3.10",
          run: {
            name: "No-Mistakes Review",
            v: 8,
            state: "Reviewing",
            tone: "running",
            round: 2,
            max: 5,
            rung: "Stage 3",
            sub: "3 reviewers · all must pass",
            rungState: "Running",
            members: [
              { tone: "passed", glyph: "✓", name: "Code Risk Reviewer" },
              { tone: "running", glyph: "●", name: "Test Evidence Auditor" },
              { tone: "running", glyph: "●", name: "Documentation Steward" },
            ],
          },
        },
        {
          id: "s6",
          name: "Task source dedupe by external id",
          agent: "codex",
          tone: "idle",
          goal: "A re-swept issue files a second task because the seen row is keyed on the URL",
          branch: "harness/source-dedupe",
          seen: "12m",
          model: "GPT-5.6",
          ctx: 22,
          mode: "approve",
          cost: "≈$0.88",
          run: {
            name: "No-Mistakes Review",
            v: 8,
            state: "Waiting for PR",
            tone: "waiting",
            round: 1,
            max: 5,
            rung: "Pull Request",
            sub: "1 session action",
            rungState: "Awaiting push",
            members: [],
          },
        },

        // ---- idle, and genuinely free ----
        {
          id: "s7",
          name: "Persona versioning docs",
          agent: "claude",
          tone: "idle",
          goal: "Document how a persona revision reaches an in-flight run",
          branch: "harness/persona-docs",
          seen: "3h",
          model: "Sonnet 4.6",
          ctx: 12,
          mode: "accept edits",
          cost: "≈$0.09",
        },
        {
          id: "s8",
          name: "Ensemble decision typography",
          agent: "codex",
          tone: "idle",
          goal: null,
          branch: "harness/ensemble-type",
          seen: "41m",
          model: "GPT-5.6",
          ctx: 8,
          mode: "approve",
          cost: "≈$0.04",
        },

        {
          id: "s9",
          name: "Cost telemetry rollup",
          agent: "claude",
          tone: "exited",
          goal: "Roll per-call cost into the daily total",
          branch: "harness/cost-rollup",
          seen: "1h",
          model: "Sonnet 4.6",
          ctx: 55,
          mode: "accept edits",
          cost: "≈$0.72",
        },
      ];

      const BACKLOG = [
        { title: "Stash rail loses its tooltip after a reveal", repo: "ai-harness", prio: "med" },
        { title: "Codex rollout scan cap at 400 files", repo: "ai-harness", prio: "high" },
      ];

      const COLUMNS = [
        { tone: "attention", label: "needs you" },
        { tone: "working", label: "working" },
        { tone: "idle", label: "idle" },
        { tone: "neutral", label: "unconfirmed" },
        { tone: "exited", label: "gone" },
      ];

      const CAPTIONS = {
        count: {
          k: "A",
          body:
            "<b>The column stops lying about its count.</b> Nothing moves and nothing is added to the "
            + "tile - the peek already says which run holds it. The idle head reports <b>2 free</b> and "
            + "<b>3 held</b> instead of one number that means neither, the topbar stat follows, and a "
            + "held tile carries the purple spine and a <b>held</b> tag so the two kinds of idle are "
            + "separable at a glance. Cheapest of the four by a wide margin.",
          up: [
            "Restores the capacity read with no reordering and no new tile content",
            "Nothing about keyboard nav, clustering or column modes changes",
          ],
          down: [
            "Held and free tiles still interleave, so you read every tile to find a free one",
            "The drag still lands: <code>canAcceptTask</code> is untouched",
          ],
        },
        split: {
          k: "B",
          body:
            "<b>The idle column sorts free to the top.</b> A <i>free</i> rule and a <i>held by a "
            + "workflow</i> rule split the column, so the agents you can actually dispatch to are "
            + "contiguous and first. The held group carries the explanation once for all of them rather "
            + "than repeating it per tile. Builds on A - it keeps the split count.",
          up: [
            "Free agents are contiguous and first; you stop scanning past held ones",
            "Explains once per group, not once per tile",
          ],
          down: [
            "A second grouping axis inside a column that is already a group",
            "Arrow-key nav and <code>fleetBlocks</code> clustering both have to learn the boundary",
          ],
        },
        refuse: {
          k: "C",
          body:
            "<b>Fix the affordance, not the label.</b> <code>canAcceptTask</code> learns about open "
            + "runs, so a held tile stops lighting up as a drop target and says <b>⊘ held by the run</b> "
            + "where <code>↳ drop to hand this over</code> would have been. The peek gains one line "
            + "saying the run sends the next round on its own. This is the only treatment that changes "
            + "what the board <i>lets you do</i> rather than what it says.",
          up: [
            "<b>Closes the footgun</b> - the drop resets an agent mid-run today",
            "The refusal is stated where the invitation was, so it answers the question you asked",
          ],
          down: [
            "Alone it does not fix the count: the header still reads 5",
            "A refusal has to survive the drag; the reason must come from the run, not a guess",
          ],
        },
        column: {
          k: "D",
          body:
            "<b>A sixth column, between <i>working</i> and <i>idle</i>.</b> Held sessions leave the "
            + "idle column entirely, so <code>idle</code> means <i>free, take me</i> again - which is "
            + "what the topbar stat and Foreman's <code>agentIsFree</code> already assume. It sits after "
            + "<i>working</i> because the fleet <i>is</i> busy on this work; only the agent is not.",
          up: [
            "<code>idle</code> means free again - one column, one meaning",
            "Held work gets a place beside the other work in flight",
          ],
          down: [
            "A sixth column on a board that already scrolls horizontally at five",
            "<code>held</code> is not a <code>SessionState</code> - no daemon reports it",
            "<b>Does not close the footgun.</b> <code>canAcceptTask</code> reads the session's TONE, "
              + "not its column - the tile moves and stays droppable. D needs C.",
          ],
        },
      };

      const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);

      let treatment = "count";
      let dragging = false;

      const isHeld = (s) => Boolean(s.run);

      /**
       * `canAcceptTask` (BacklogColumn.tsx:409), plus whatever the treatment changes.
       * Only C teaches it about runs; A, B and D leave it exactly as it ships, which is
       * the whole point of the drag simulation.
       */
      function canAcceptTask(s) {
        if (!dragging) return false;
        if (s.tone !== "idle") return false;
        if (treatment === "refuse" && isHeld(s)) return false;
        return true;
      }

      function peek(s) {
        const r = s.run;
        return `<section class="wf-tile-peek workflow-${r.tone}">
          <header class="wf-tile-peek-head">
            <span class="wf-tile-peek-name">⌁ ${esc(r.name)}</span>
            <span class="wf-tile-peek-version">v${r.v}</span>
            <span class="wf-tile-peek-runstate workflow-${r.tone}">${esc(r.state)}</span>
            <span class="wf-tile-peek-round">R${r.round} / ${r.max}</span>
          </header>
          <div class="wf-tile-peek-rung">
            <div class="wf-tile-peek-row">
              <span class="wf-tile-peek-title"><strong>${esc(r.rung)}</strong><span>${esc(r.sub)}</span></span>
              <span class="wf-tile-peek-state">${esc(r.rungState)}</span>
            </div>
            ${r.members.length
              ? `<div class="wf-tile-peek-members">${r.members
                  .map((m) => `<span class="workflow-${m.tone}"><span>${m.glyph}</span> ${esc(m.name)}</span>`)
                  .join("")}</div>`
              : ""}
            ${treatment === "refuse"
              ? `<p class="peek-held-line">The run owns this session's next turn. It sends round ${r.round + 1} on its own when ${esc(r.rung)} reports.</p>`
              : ""}
          </div>
        </section>`;
      }

      function tile(s) {
        const held = isHeld(s);
        // In D the COLUMN says held, so the tag on the tile would be saying it twice.
        const showTag = held && treatment !== "column";
        const droppable = canAcceptTask(s);
        const refused = dragging && treatment === "refuse" && held;
        const cls = [
          "tile",
          `tone-${s.tone}`,
          s.tone === "attention" ? "attention" : "",
          held ? "is-held" : "",
          droppable ? "can-drop" : "",
          refused ? "is-refused" : "",
        ].filter(Boolean).join(" ");
        const warn = s.ctx >= 70 ? "var(--attention)" : "var(--idle)";
        return `<div class="${cls}">
          <span class="tile-head">
            <span class="agent-dot" style="--agent-accent: ${ACCENT[s.agent]}"></span>
            <span class="tile-name">${esc(s.name)}</span>
            ${showTag ? '<span class="held-tag">held</span>' : ""}
          </span>
          ${s.goal ? `<span class="tile-goal">${esc(s.goal)}</span>` : ""}
          ${s.activity ? `<span class="tile-activity"><span class="ta-glyph">⟳</span><span class="ta-txt">${esc(s.activity)}</span></span>` : ""}
          ${held ? peek(s) : ""}
          ${held
            ? `<div class="tile-workflow-disclosure-row">
                 <button class="tile-workflow-disclosure-btn"><span class="tile-workflow-chevron">⌄</span> Show workflow</button>
                 <span class="tile-workflow-disclosure-hint">The active rung stays in context</span>
               </div>`
            : ""}
          <span class="tile-marks">
            ${s.runtime === "sdk" ? '<span class="tile-flag runtime-flag">◈ Agent SDK</span>' : ""}
            ${(s.marks ?? []).map((m) => `<span class="tile-flag ${m.cls}">${esc(m.text)}</span>`).join("")}
          </span>
          ${droppable ? '<span class="tile-drop-hint">↳ drop to hand this over</span>' : ""}
          ${refused ? `<span class="tile-drop-refused">⊘ held by ${esc(s.run.name)} · R${s.run.round}/${s.run.max}</span>` : ""}
          <span class="tile-runtime-line">
            <span class="rt-pill">${esc(s.model)}</span>
            <span class="rt-ctx"><span class="rt-meter"><span class="rt-meter-fill" style="width:${s.ctx}%;background:${warn}"></span></span>${s.ctx}%</span>
            <span class="mode">${esc(s.mode)}</span>
            <span class="cost-chip">${esc(s.cost)}</span>
          </span>
          <span class="tile-foot">
            <span class="tile-branch">${esc(s.branch)}</span>
            <span class="tile-seen">${esc(s.seen)}</span>
          </span>
        </div>`;
      }

      function backlogCol() {
        return `<section class="board-col board-backlog">
          <header class="board-col-head">
            <h2 style="color: var(--muted)">Backlog</h2>
            <span class="board-col-n">${BACKLOG.length}</span>
          </header>
          <div class="board-col-body">
            ${BACKLOG.map((t, i) => `<div class="bl-card${dragging && i === 0 ? " lifted" : ""}">
              <span class="bl-title">${esc(t.title)}</span>
              <span class="bl-meta"><span class="bl-repo">${esc(t.repo)}</span>·<span>${esc(t.prio)}</span></span>
            </div>`).join("")}
            ${dragging ? '<p class="board-col-note">Card in the air - the board is showing its drop targets.</p>' : ""}
          </div>
        </section>`;
      }

      function head(tone, label, pills) {
        return `<header class="board-col-head">
          <span class="board-swatch"></span><h2>${esc(label)}</h2>
          ${pills.map((p) => `<span class="board-col-n ${p.cls || ""}"${p.title ? ` title="${esc(p.title)}"` : ""}>${esc(p.text)}</span>`).join("")}
        </header>`;
      }

      function render() {
        document.body.classList.toggle("dragging", dragging);
        const held = FLEET.filter(isHeld);
        const out = [backlogCol()];

        for (const col of COLUMNS) {
          let list = FLEET.filter((s) => s.tone === col.tone);
          if (treatment === "column" && col.tone === "idle") list = list.filter((s) => !isHeld(s));

          if (list.length === 0 && col.tone === "attention") {
            out.push(`<section class="board-col tone-attention is-calm">
              ${head("attention", col.label, [{ text: "0" }])}
              <div class="board-col-body"><p class="board-allclear"><span class="board-allclear-tick">✓</span><b>All clear</b><span>Nothing is waiting on you</span></p></div>
            </section>`);
            continue;
          }
          if (list.length === 0) continue; // stashed

          if (col.tone === "idle" && treatment === "split") {
            const free = list.filter((s) => !isHeld(s));
            const blocked = list.filter(isHeld);
            out.push(`<section class="board-col tone-idle">
              ${head("idle", col.label, [
                { text: `${free.length} free`, cls: "n-free", title: `${free.length} of ${list.length} idle agents can take work` },
                { text: `${blocked.length} held`, cls: "n-held", title: "Bound to a workflow run that is still open" },
              ])}
              <div class="board-col-body">
                <span class="col-sect s-free"><b>free</b><span class="cnt">${free.length}</span></span>
                ${free.map(tile).join("")}
                <span class="col-sect s-held"><b>held by a workflow</b><span class="cnt">${blocked.length}</span></span>
                <p class="held-why">Each finished its turn and is waiting on a run that is still open. The run sends the next round on its own.</p>
                ${blocked.map(tile).join("")}
              </div>
            </section>`);
            continue;
          }

          let pills = [{ text: `${list.length}` }];
          if (col.tone === "idle" && treatment === "count") {
            const free = list.filter((s) => !isHeld(s)).length;
            pills = [
              { text: `${free} free`, cls: "n-free", title: `${free} of ${list.length} idle agents can take work` },
              { text: `${list.length - free} held`, cls: "n-held", title: "Bound to a workflow run that is still open" },
            ];
          }
          if (col.tone === "idle" && treatment === "column") {
            pills = [{ text: `${list.length}`, cls: "n-free", title: "Free to take work" }];
          }

          out.push(`<section class="board-col tone-${col.tone}">
            ${head(col.tone, col.label, pills)}
            <div class="board-col-body">
              ${col.tone === "idle" && treatment === "column" ? '<p class="board-col-note">Free to take work.</p>' : ""}
              ${list.map(tile).join("")}
            </div>
          </section>`);

          if (treatment === "column" && col.tone === "working") {
            out.push(`<section class="board-col tone-held col-held">
              ${head("held", "held", [{ text: `${held.length}`, cls: "n-held", title: "Bound to a workflow run that is still open" }])}
              <div class="board-col-body">
                <p class="board-col-note">Idle, but a running workflow owns the next turn.</p>
                ${held.map(tile).join("")}
              </div>
            </section>`);
          }
        }

        out.push(`<div class="board-stash">
          <span class="board-stash-label">empty</span>
          <button class="board-stash-chip tone-neutral"><span class="board-swatch"></span>unconfirmed</button>
        </div>`);

        document.getElementById("board").innerHTML = out.join("");

        const freeCount = FLEET.filter((s) => s.tone === "idle" && !isHeld(s)).length;
        document.getElementById("capacity-stat").innerHTML =
          treatment === "refuse"
            ? `<span class="stat-n">5</span><span class="stat-label">idle</span>`
            : `<span class="stat-n" style="color: var(--idle)">${freeCount}</span><span class="stat-label">free</span>`
              + `<span class="stat-n" style="color: var(--held); margin-left: 4px">${held.length}</span><span class="stat-label">held</span>`;

        const c = CAPTIONS[treatment];
        document.getElementById("cap-k").textContent = c.k;
        document.getElementById("cap-body").innerHTML = c.body;
        document.getElementById("cap-tradeoffs").innerHTML =
          c.up.map((x) => `<span class="t up"><span class="g">+</span><span>${x}</span></span>`).join("")
          + c.down.map((x) => `<span class="t down"><span class="g">−</span><span>${x}</span></span>`).join("");

        for (const b of document.querySelectorAll(".lab button[data-t]")) {
          b.classList.toggle("on", b.dataset.t === treatment);
        }
        const dt = document.getElementById("drag-toggle");
        dt.classList.toggle("on", dragging);
        dt.textContent = dragging ? "◆ Drag in progress - click to drop it" : "◇ Simulate a backlog drag";
      }

      const ORDER = ["count", "split", "refuse", "column"];
      for (const b of document.querySelectorAll(".lab button[data-t]")) {
        b.addEventListener("click", () => {
          treatment = b.dataset.t;
          render();
        });
      }
      document.getElementById("drag-toggle").addEventListener("click", () => {
        dragging = !dragging;
        render();
      });
      addEventListener("keydown", (e) => {
        const i = Number(e.key) - 1;
        if (ORDER[i] && !e.metaKey && !e.ctrlKey) {
          treatment = ORDER[i];
          render();
        }
        if (e.key.toLowerCase() === "d") {
          dragging = !dragging;
          render();
        }
      });
      render();
    </script>
  </body>
</html>
