name: CI

# Exercises the repository's quality gates - typecheck, unit tests, build, and a boot
# smoke - on every push to main and every pull request. Mirrors `make check` (typecheck
# + tests) plus a production build and a check that the built bundles actually RUN.
#
# That last step is not redundant with Build, and the comment it replaces claimed it was:
# it said a production build meant "a broken bundle can't merge unnoticed", which was
# false and shipped. `npm run build` only asserts that esbuild emitted a file. A daemon
# bundle that throws on its first line still builds, still typechecks, and still passes
# every unit test - because the tests import from `src/`, and nothing here ever ran the
# artifact. See `scripts/smoke-bundles.mjs`.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref so a fresh push doesn't queue behind stale work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # >=24 is required (node:sqlite is used unflagged from Node 24). Test the
        # supported floor and the current release. Node 25 is EOL.
        node-version: ['24', '26']

    name: check (node ${{ matrix.node-version }})

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These checks are independent: typecheck and tests read source, while build writes
      # only `dist/`. Run them together so the longest one, rather than their sum,
      # determines the gate's duration. Collect every exit status so a failure does not
      # hide failures from the other concurrent checks.
      - name: Typecheck, test, and build
        shell: bash
        run: |
          pids=()
          npm run typecheck & pids+=($!)
          npm test & pids+=($!)
          npm run build & pids+=($!)

          check_status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || check_status=1
          done
          exit "$check_status"

      # Runs the bundles Build just produced. Ordered after the concurrent gate because
      # it needs `dist/` and should not run when one of those checks has failed.
      - name: Smoke the built bundles
        run: npm run smoke

  # Full macOS app packaging. It's slow (downloads the Electron runtime + builds a
  # dmg), so it only runs for tagged releases or a manual dispatch - not every PR.
  # There are no native modules to rebuild (node:sqlite is a builtin), so this just
  # bundles + wraps with electron-builder and uploads the dmg as an artifact.
  package:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    name: package (macOS arm64)
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package
        run: npm run package

      - name: Upload dmg
        uses: actions/upload-artifact@v4
        with:
          name: mission-control-dmg
          path: release/*.dmg
