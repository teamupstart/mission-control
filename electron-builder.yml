# electron-builder config for the macOS (Apple Silicon) desktop build.
#
# The app is fully self-contained from the artifacts under dist/ - the daemon,
# UI, MCP server, and hook bridge each inline their JS deps, while the daemon's
# raw Node-API state-lock and Keep Awake addons ship under dist/native/. node:sqlite is a
# builtin, so no node_modules ship at runtime.
#
# asar is OFF on purpose: Claude Code launches the satellite scripts
# (dist/satellites/hook.mjs, dist/mcp/server.mjs) with an EXTERNAL node that
# can't read inside an asar archive, so they must be plain files on disk.
appId: com.mission-control.app
productName: Mission Control
copyright: Copyright © 2026 Jordan Mance

asar: false

# Automatic moves remain gated until the isolated packaged macOS exercise passes.
extraMetadata:
  missionInstallMigration:
    protocol: 1
    automatic: false

directories:
  output: release
  buildResources: build

# Only the built artifacts + the tray image + the skills catalog + package.json
# (for "main"/version). `dist/**/*` includes both native addons beside
# the JS bundles. node_modules are intentionally excluded: every JS runtime dep
# is inlined by esbuild, and node:sqlite is a builtin. This keeps the app ~275MB smaller.
#
# `skills/` ships as SOURCE rather than through dist because Claude - not us - is the
# thing that reads it: the daemon only symlinks `~/.claude/skills/mission-<id>` at it,
# and an external claude then reads the SKILL.md through that link. Which is exactly
# why `asar: false` above is load-bearing for this too, and not only for the
# satellites: a symlink into an archive resolves to nothing.
files:
  - dist/**/*
  - skills/**/*
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  # The SEED for Foreman's instructions setting, read under the app root by
  # `foremanInstructionsPath()`. Shipped as plain markdown rather than baked into the
  # bundle so it stays the one editable copy - see `src/server/foreman/instructions.ts`.
  #
  # This ONE file, not `personas/**/*`: the four workflow persona documents beside it are
  # compiled into the server bundle by `npm run personas` (see the header of
  # `scripts/builtin-markdown.ts`), so shipping the directory would put a second, ignored
  # copy of them in the app - and `personas/INSPECTOR.md` is a brief the Inspector reads
  # from the repository under review, never from the install.
  - personas/FOREMAN.md
  # Copied to a temp directory before it outlives and replaces the app bundle.
  # Keep the detached helper and its dependency graph as plain files with asar disabled.
  # The bundle-swap module owns the narrowly scoped in-place macOS authorization prompt.
  - scripts/apply-update.mjs
  - scripts/app-bundle-swap.mjs
  - scripts/update-lock.mjs
  - scripts/install-migration.mjs
  - scripts/migration-runtime.mjs
  - scripts/install-destination.mjs
  - src/shared/install-receipt-schema.mjs
  - src/shared/update-source.mjs
  - src/shared/staged-bundle.mjs
  - LICENSE
  - NOTICE
  - package.json
  - "!node_modules/**/*"

mac:
  target:
    - target: dmg
      arch: arm64
    - target: dir
      arch: arm64
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Local, unsigned/ad-hoc build (this Mac only). electron-builder applies an
  # ad-hoc signature so the arm64 binary can execute; no notarization.
  identity: null
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  title: Mission Control
  # Stated rather than defaulted, and the default is what had to go: electron-builder's built-in
  # layout puts an alias to /Applications beside the app, which teaches every recipient to
  # install system-wide - the one destination that needs an administrator password and the one
  # this product no longer defaults to. There is deliberately no replacement alias: a dmg is
  # built once and opened on somebody else's Mac, so a link can only ever name a fixed path, and
  # neither this build account's home nor a literal `~` is that person's Applications folder.
  # The Read Me says in words what a link cannot say correctly, including that a dmg install is
  # unmanaged and how to turn updates on.
  contents:
    - x: 150
      y: 180
      type: file
    - x: 390
      y: 180
      type: file
      path: build/dmg/readme.txt
      name: Read Me.txt
