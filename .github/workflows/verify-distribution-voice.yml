name: Verify distribution voice listener
on:
  pull_request:
    paths:
      - .github/workflows/verify-distribution-voice.yml
permissions:
  contents: read
jobs:
  voice-listener:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit
      - run: node scripts/probe-distribution-voice-listener.mjs
