<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Mission Control</title>
    <style>
      /* Troubleshooting copy for a start that stalled. A healthy load replaces #root well
         inside two seconds, so this never paints for it. CSS rather than a timer, because
         the stall it explains is the entry script never running. */
      .startup-pending { visibility: hidden; animation: startup-pending-reveal 0s 2s forwards; }
      @keyframes startup-pending-reveal { to { visibility: visible; } }
    </style>
  </head>
  <body>
    <div id="root">
      <section class="startup-pending" role="status" style="max-width: 48rem; margin: 4rem auto; padding: 1rem; font-family: system-ui, sans-serif">
        <h1>Loading Mission Control</h1>
        <p>If this message stays here, the dashboard JavaScript has not started. Reload, then check Chrome DevTools Console and Network for blocked or missing assets. Make sure the Linux build completed and forward the daemon port to http://localhost:&lt;local-port&gt;/.</p>
        <noscript>JavaScript must be enabled to use the dashboard.</noscript>
      </section>
    </div>
    <script type="module" src="./bootstrap.ts"></script>
  </body>
</html>
