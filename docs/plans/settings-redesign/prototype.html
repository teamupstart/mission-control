<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mission Control - Settings prototype (B + E + F + search)</title>
<style>
/* App tokens, mirrored from src/web/styles.css */
:root {
  color-scheme: dark;
  --bg: #0a0c0f; --bg-2: #0e1116; --panel: #14181e; --panel-2: #171c23;
  --border: #232a33; --bsoft: #1b2129;
  --fg: #e7ebf1; --muted: #939eae; --dim: #7c8798;
  --blue: #4a9eff; --green: #35c08a; --amb: #f6a733; --red: #f85149;
  --purple: #a371f7; --claude: #d97757; --codex: #10a37f;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font: 13px/1.5 var(--sans);
  color: var(--fg);
  background:
    radial-gradient(1200px 600px at 80% -10%, #12202f 0%, transparent 55%),
    radial-gradient(900px 500px at 0% 0%, #1a1424 0%, transparent 50%),
    var(--bg);
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
input, select { font: inherit; }
code { font: 11px var(--mono); background: rgba(255,255,255,0.05); border-radius: 4px; padding: 1px 4px; white-space: nowrap; }

/* topbar */
.topbar {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 22px; border-bottom: 1px solid var(--bsoft);
  background: rgba(14, 17, 22, 0.85); flex: none;
}
.brand { font: 700 12px var(--mono); letter-spacing: 0.06em; }
.proto-tag {
  font: 600 9.5px var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--amb); border: 1px solid color-mix(in oklab, var(--amb) 45%, var(--border));
  border-radius: 20px; padding: 2.5px 9px; background: rgba(246,167,51,0.08);
}
.topbar .grow { flex: 1; }
.top-chip { font-size: 11px; color: var(--muted); border: 1px solid var(--border); border-radius: 7px; padding: 4px 10px; white-space: nowrap; }
.gear { position: relative; font-size: 15px; }
.gear .gear-dot { position: absolute; top: -1px; right: -2px; width: 7px; height: 7px; border-radius: 50%; border: 2px solid var(--bg-2); display: none; }

/* shell */
.shell { flex: 1; min-height: 0; display: flex; justify-content: center; }
.page { flex: 1; max-width: 1400px; min-width: 0; display: flex; align-items: stretch; }

/* rail */
.rail {
  flex: 0 0 236px; display: flex; flex-direction: column; gap: 2px;
  padding: 16px 12px; border-right: 1px solid var(--bsoft);
  background: color-mix(in oklab, var(--panel-2) 55%, transparent);
  overflow-y: auto;
}
.rail-search {
  display: flex; align-items: center; gap: 8px;
  margin: 0 2px 10px; padding: 7px 10px;
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
  color: #566070; font-size: 11.5px; cursor: pointer; width: calc(100% - 4px);
}
.rail-search:hover { border-color: var(--dim); color: var(--muted); }
.rail-search kbd {
  margin-left: auto; font: 10px var(--mono); color: var(--dim);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; background: var(--panel);
}
.navlab {
  display: flex; align-items: center; gap: 7px;
  margin: 13px 6px 4px; font: 640 9px var(--mono);
  letter-spacing: 0.07em; text-transform: uppercase; color: #5f6a7a; white-space: nowrap;
}
.navlab:first-of-type { margin-top: 2px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; width: 100%;
  padding: 7px 10px; border-radius: 8px; border: 1px solid transparent;
  color: var(--muted); font-size: 12.5px; font-weight: 540; white-space: nowrap;
  transition: background 0.14s ease, color 0.14s ease, border-color 0.14s ease;
}
.nav-item:hover { background: var(--panel); color: var(--fg); }
.nav-item.on {
  background: color-mix(in oklab, var(--blue) 14%, transparent);
  border-color: color-mix(in oklab, var(--blue) 30%, var(--border));
  color: var(--fg); font-weight: 600;
}
.nav-item .ic { flex: none; width: 16px; text-align: center; font-size: 13px; color: var(--dim); }
.nav-item.on .ic, .nav-item:hover .ic { color: var(--fg); }
.dot { width: 6px; height: 6px; border-radius: 50%; margin-left: auto; flex: none; }
.dot-live { background: var(--green); box-shadow: 0 0 5px rgba(53,192,138,0.7); }
.dot-armed { background: var(--amb); box-shadow: 0 0 5px rgba(246,167,51,0.7); }
.dot-fail { background: var(--red); box-shadow: 0 0 5px rgba(248,81,73,0.7); }
.dot-fore { background: var(--purple); box-shadow: 0 0 5px rgba(163,113,247,0.7); }

/* scope chips */
.scope {
  display: inline-flex; align-items: center;
  font: 600 9px var(--mono); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 2px 7px; border-radius: 20px; border: 1px solid; white-space: nowrap;
}
.navlab .scope { margin-left: auto; }
.scope-browser { color: #7fb2ff; border-color: rgba(127,178,255,0.4); background: rgba(127,178,255,0.09); }
.scope-machine { color: #4cc796; border-color: rgba(76,199,150,0.4); background: rgba(76,199,150,0.09); }
.scope-home { color: #e5ad4f; border-color: rgba(229,173,79,0.45); background: rgba(229,173,79,0.09); }
.scope-github { color: #f57e73; border-color: rgba(245,126,115,0.45); background: rgba(245,126,115,0.09); }

/* panel */
.panel { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 30px 60px; }
.panel-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
.panel-head h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -0.01em; }
.blurb { font-size: 11.5px; color: var(--dim); line-height: 1.55; margin: 4px 0 14px; max-width: 62em; }
.hint { font-size: 11.5px; color: var(--dim); line-height: 1.55; margin: 7px 0; }
.glabel {
  margin: 20px 0 7px; font-size: 10.5px; font-weight: 640;
  text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim);
}
.warn {
  border: 1px solid color-mix(in oklab, var(--amb) 40%, var(--border));
  background: rgba(246,167,51,0.07); color: #f2c57c;
  font-size: 11.5px; line-height: 1.55; border-radius: 9px; padding: 8px 12px; margin: 8px 0; max-width: 62em;
}
.warn.danger { border-color: color-mix(in oklab, var(--red) 42%, var(--border)); background: rgba(248,81,73,0.07); color: #f0958e; }
.warn .lnk, a.lnk { color: #7fb2ff; border-bottom: 1px solid rgba(127,178,255,0.4); cursor: pointer; text-decoration: none; white-space: nowrap; }

/* rows */
.row { display: flex; align-items: center; gap: 14px; padding: 9px 10px; border-radius: 9px; border: 1px solid transparent; max-width: 760px; }
.row:hover { background: var(--panel-2); }
.rtext { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.rlab { font-size: 12.5px; font-weight: 570; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.rdesc { font-size: 11.5px; color: var(--dim); line-height: 1.5; }
.badge {
  font-size: 9.5px; font-weight: 640; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--dim); border: 1px solid var(--border); border-radius: 5px; padding: 1.5px 6px; white-space: nowrap;
}
fieldset.cascade { border: 0; margin: 0; padding: 0; }
fieldset.cascade:disabled { opacity: 0.45; pointer-events: none; }

/* controls */
.switch { position: relative; width: 32px; height: 18px; flex: none; display: inline-block; cursor: pointer; }
.switch input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.switch i {
  position: absolute; inset: 0; border-radius: 10px; background: var(--border); transition: background 0.15s ease;
}
.switch i::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%;
  background: var(--dim); transition: left 0.15s ease, background 0.15s ease;
}
.switch input:checked + i { background: var(--green); }
.switch input:checked + i::after { left: 16px; background: #06251a; }
.switch input:focus-visible + i { outline: 2px solid var(--blue); outline-offset: 2px; }

select.sel, input.tin {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; color: var(--fg); font-size: 12px;
}
select.sel:focus, input.tin:focus { outline: none; border-color: var(--blue); }
input.tin.mono, select.sel.mono { font-family: var(--mono); font-size: 11.5px; }
input.tin::placeholder { color: #566070; }

.seg { display: inline-flex; gap: 3px; background: var(--bg-2); border: 1px solid var(--bsoft); border-radius: 9px; padding: 3px; }
.seg button { padding: 5px 12px; border-radius: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.seg button.on { color: var(--fg); background: color-mix(in oklab, var(--blue) 16%, var(--panel-2)); }
.seg button:not(.on):hover { color: var(--fg); }

.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--panel-2); color: var(--fg); font-size: 12px; white-space: nowrap; cursor: pointer;
}
.btn:hover { border-color: var(--dim); }
.btn.primary { background: color-mix(in oklab, var(--blue) 20%, var(--panel-2)); border-color: color-mix(in oklab, var(--blue) 40%, var(--border)); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }

.kcap {
  font: 11px var(--mono); color: var(--fg);
  background: var(--bg-2); border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 6px; padding: 4px 10px; white-space: nowrap; cursor: pointer; min-width: 44px; text-align: center;
}
.kcap.rec { color: var(--amb); border-color: color-mix(in oklab, var(--amb) 50%, var(--border)); animation: pulse 1.1s ease infinite; }
@keyframes pulse { 50% { background: rgba(246,167,51,0.12); } }
.kreset { color: #566070; font-size: 13px; padding: 4px 6px; }
.kreset:disabled { opacity: 0.35; }
.conflict { color: var(--amb); font-size: 11px; }
.err { color: var(--red); font-size: 11.5px; margin: 6px 0; }

/* layout picker glyph options */
.layout-pick { display: flex; flex-direction: column; gap: 7px; max-width: 620px; }
.lopt {
  display: flex; gap: 12px; align-items: flex-start; padding: 11px 13px;
  border: 1px solid var(--border); border-radius: 10px; cursor: pointer; background: color-mix(in oklab, var(--panel) 70%, transparent);
}
.lopt.on { border-color: color-mix(in oklab, var(--blue) 45%, var(--border)); background: color-mix(in oklab, var(--blue) 8%, var(--panel)); }
.lopt svg { flex: none; margin-top: 2px; color: var(--dim); }
.lopt.on svg { color: var(--blue); }
.lopt b { font-size: 12.5px; display: block; margin-bottom: 2px; }
.lopt span { font-size: 11.5px; color: var(--dim); line-height: 1.5; }

/* harness cards (Mockup F) */
.hcards { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 420px)); gap: 12px; }
.hcard {
  border: 1px solid var(--border); border-left: 3px solid var(--agent-accent, var(--dim));
  border-radius: 10px; background: var(--panel); padding: 13px 16px;
}
.hcard-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.hcard-head .adot { width: 8px; height: 8px; border-radius: 50%; background: var(--agent-accent, var(--dim)); }
.hcard-head b { font-size: 13px; }
.hcard-grid { display: grid; grid-template-columns: auto 1fr; gap: 8px 12px; align-items: center; }
.hcard-grid label { font-size: 11px; color: var(--dim); }
.hcard .hnote { font-size: 11px; color: var(--dim); line-height: 1.5; margin: 10px 0 0; }
.hcard .hnote code { color: var(--muted); }

/* repo / ledger */
.repo-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 11px; border: 1px solid var(--bsoft); border-radius: 8px;
  background: var(--bg-2); font: 11.5px var(--mono); color: #c7cdd8; max-width: 760px;
}
.repo-row + .repo-row { margin-top: 5px; }
.ledger { display: flex; flex-direction: column; gap: 4px; max-width: 760px; }
.lrow { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; padding: 6px 10px; border-radius: 8px; font-size: 12px; }
.lrow:nth-child(odd) { background: rgba(255,255,255,0.018); }
.lrow .pr { color: #7fb2ff; font-family: var(--mono); font-size: 11.5px; }
.lrow .when { color: #566070; font-size: 11px; }
.state { font-size: 11px; color: var(--muted); }
.state.good { color: var(--green); } .state.merged { color: var(--purple); }
.state.warnc { color: var(--amb); } .state.bad { color: var(--red); }

/* stepper */
.stepper { display: inline-flex; align-items: center; gap: 8px; }
.stepper button { padding: 4px 10px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--muted); }
.stepper button:hover { color: var(--fg); border-color: var(--dim); }
.stepper .val {
  min-width: 46px; text-align: center; font: 12px var(--mono);
  background: var(--bg-2); border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px;
}

/* task sources master-detail (Mockup B) */
.metrics { display: flex; gap: 10px; margin: 4px 0 16px; flex-wrap: wrap; }
.metric {
  border: 1px solid var(--bsoft); border-radius: 10px; background: var(--panel-2);
  padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; min-width: 118px;
}
.metric b { font-size: 19px; font-weight: 650; }
.metric span { font-size: 10.5px; color: var(--dim); }
.metric .good { color: var(--green); } .metric .warnc { color: var(--amb); }
.md { display: flex; gap: 22px; align-items: flex-start; }
.md-list { flex: 0 0 320px; min-width: 0; }
.md-tools { display: flex; gap: 7px; margin-bottom: 9px; }
.md-tools input { flex: 1; min-width: 0; }
.chips { display: flex; gap: 5px; margin-bottom: 10px; flex-wrap: wrap; }
.chips button {
  font-size: 10px; font-weight: 640; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--dim); border: 1px solid var(--border); border-radius: 5px; padding: 2.5px 8px;
}
.chips button.on { color: var(--fg); border-color: color-mix(in oklab, var(--blue) 40%, var(--border)); background: rgba(74,158,255,0.12); }
.chips button.warn-chip.on { border-color: color-mix(in oklab, var(--amb) 45%, var(--border)); background: rgba(246,167,51,0.1); color: var(--amb); }
.src-item {
  width: 100%; border: 1px solid var(--bsoft); background: var(--panel);
  border-radius: 10px; padding: 10px 12px; margin-bottom: 6px; cursor: pointer;
}
.src-item:hover { border-color: var(--dim); }
.src-item.on { border-color: color-mix(in oklab, var(--blue) 35%, var(--border)); background: color-mix(in oklab, var(--blue) 8%, var(--panel)); }
.src-item.paused { opacity: 0.65; }
.src-line1 { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.src-line1 b { font-size: 12.5px; }
.src-meta { font-size: 11px; color: var(--dim); margin-top: 3px; }
.health { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; white-space: nowrap; }
.health i { width: 7px; height: 7px; border-radius: 50%; }
.health.ok { color: var(--green); } .health.ok i { background: var(--green); }
.health.warnc { color: var(--amb); } .health.warnc i { background: var(--amb); }
.health.mute { color: var(--dim); } .health.mute i { background: var(--dim); }
.md-editor { flex: 1; min-width: 0; border: 1px solid var(--bsoft); border-radius: 12px; background: var(--panel); padding: 15px 18px; }
.ed-head { display: flex; align-items: center; gap: 10px; }
.ed-head b { font-size: 13px; }
.ed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; margin-top: 10px; max-width: 640px; }
.ed-grid label, .fcol { display: flex; flex-direction: column; gap: 4px; }
.ed-grid .flab, .flab { font-size: 10px; font-weight: 640; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
.ed-actions { display: flex; gap: 8px; margin-top: 15px; padding-top: 12px; border-top: 1px solid var(--bsoft); align-items: center; flex-wrap: wrap; }
.ed-note { font-size: 11.5px; color: var(--green); }

/* trust matrix (Mockup E) */
.matrix { border: 1px solid var(--bsoft); border-radius: 11px; max-width: 860px; overflow: hidden; }
.mx-grid { display: grid; grid-template-columns: 1fr 150px 158px 130px 40px; align-items: stretch; }
.mx-h {
  padding: 9px 12px; background: var(--panel-2);
  font-size: 10px; font-weight: 640; text-transform: uppercase; letter-spacing: 0.05em; color: var(--dim); text-align: center;
}
.mx-h:first-child { text-align: left; padding-left: 14px; }
.mx-c { padding: 9px 10px; border-top: 1px solid var(--bsoft); display: flex; align-items: center; justify-content: center; }
.mx-repo { justify-content: flex-start; font: 11.5px var(--mono); color: #c7cdd8; padding-left: 14px; }
.mx-c.trap { background: rgba(246,167,51,0.06); }
.grant {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
  padding: 3px 10px; border-radius: 20px; border: 1px solid transparent; cursor: pointer;
}
.grant i { width: 7px; height: 7px; border-radius: 50%; }
.grant.yes { color: var(--green); border-color: rgba(53,192,138,0.35); background: rgba(53,192,138,0.07); }
.grant.yes i { background: var(--green); }
.grant.no { color: #566070; border-color: var(--bsoft); }
.grant.no i { background: #3a4350; }
.grant.yes.trapped { color: var(--amb); border-color: rgba(246,167,51,0.4); background: rgba(246,167,51,0.08); }
.grant.yes.trapped i { background: var(--amb); }
.grant:hover { border-color: var(--dim); }
.mx-del { color: #566070; font-size: 12px; }
.mx-del:hover { color: var(--red); }

/* search palette (Mockup D) */
.pal-veil { position: fixed; inset: 0; background: rgba(5,7,10,0.55); display: none; z-index: 40; }
.pal-veil.open { display: block; }
.pal {
  position: fixed; top: 72px; left: 50%; transform: translateX(-50%);
  width: min(640px, calc(100vw - 40px)); z-index: 41; display: none;
  background: var(--panel); border: 1px solid var(--border); border-radius: 13px;
  box-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 24px 64px rgba(0,0,0,0.55);
}
.pal.open { display: block; }
.pal-in { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--bsoft); }
.pal-in input { flex: 1; background: none; border: 0; outline: none; color: var(--fg); font-size: 14px; }
.pal-in .glass { color: #566070; }
.pal-results { padding: 8px; max-height: 380px; overflow-y: auto; }
.pal-glabel { margin: 6px 8px 4px; font-size: 10px; font-weight: 640; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
.pal-row {
  width: 100%; display: flex; align-items: center; gap: 12px;
  padding: 9px 11px; border-radius: 8px; border: 1px solid transparent; cursor: pointer;
}
.pal-row.sel { background: color-mix(in oklab, var(--blue) 12%, transparent); border-color: color-mix(in oklab, var(--blue) 30%, var(--border)); }
.pal-row .rtext { pointer-events: none; }
.pal-empty { padding: 18px 12px; color: #566070; font-size: 12px; text-align: center; }
.pal-foot { display: flex; gap: 16px; padding: 9px 16px; border-top: 1px solid var(--bsoft); font-size: 10.5px; color: #566070; }
.pal-foot b { color: var(--dim); font-weight: 600; }
.pal .scope { flex: none; }

/* flash target after a search jump */
@keyframes flash { 0% { outline-color: var(--amb); background: rgba(246,167,51,0.12); } 100% { outline-color: transparent; background: transparent; } }
.flash { outline: 2px solid transparent; outline-offset: 2px; border-radius: 9px; animation: flash 1.6s ease 2; }

@media (max-width: 860px) {
  .rail { flex-basis: 200px; }
  .md { flex-direction: column; }
  .md-list { flex: none; width: 100%; }
}
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">MISSION CONTROL</span>
  <span class="proto-tag">settings prototype · fake data</span>
  <span class="grow"></span>
  <span class="top-chip">Sitrep</span>
  <span class="top-chip">+ Dispatch</span>
  <button class="top-chip gear" id="gearBtn" title="Settings">⚙<span class="gear-dot" id="gearDot"></span></button>
</div>

<div class="shell">
  <div class="page">
    <nav class="rail" id="rail" aria-label="Settings categories"></nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

<div class="pal-veil" id="palVeil"></div>
<div class="pal" id="pal" role="dialog" aria-label="Search settings">
  <div class="pal-in">
    <span class="glass">⌕</span>
    <input id="palInput" placeholder="Search settings… (soak, model, skills, merge)" autocomplete="off" spellcheck="false">
  </div>
  <div class="pal-results" id="palResults"></div>
  <div class="pal-foot"><span><b>↑↓</b> navigate</span><span><b>↵</b> open / toggle</span><span><b>esc</b> close</span></div>
</div>

<script>
"use strict";
/* =============================================================
   Mission Control settings prototype.
   Combines: B (page container, master-detail Task sources),
   E (Trust matrix replacing the three per-panel repo lists),

const $ = (sel) => document.querySelector(sel);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(kid));
  }

}

  let k = e.key;

  if (k === " ") k = "Space";
  if (k.length === 1) k = k.toUpperCase();
  return mods + k;

function palMatches() {
  const q = $("#palInput").value.trim().toLowerCase();
  if (!q) return { settings: SEARCH.slice(0, 6), cats: [] };
  const settings = SEARCH.filter((e) => (e.label + " " + e.desc + " " + e.kw).toLowerCase().includes(q));
  const cats = Object.entries(CATS).filter(([, c]) => c.label.toLowerCase().includes(q)).map(([id]) => id);
  return { settings, cats };
}
function renderPal() {
  const { settings, cats } = palMatches();
  const box = $("#palResults");
  box.textContent = "";
  const total = settings.length + cats.length;
  if (palSel >= total) palSel = Math.max(0, total - 1);
  if (total === 0) { box.append(h("div", { class: "pal-empty" }, "Nothing matches. Try “soak”, “model”, or “merge”.")); return; }
  let idx = 0;
  if (settings.length) box.append(h("div", { class: "pal-glabel" }, "Settings"));
  for (const e of settings) {
    const i = idx++;
    const right = e.toggle
      ? sw(e.toggle(), (v) => { e.set(v); render(); renderPal(); }, e.label)
      : h("span", { class: "badge" }, "open ↵");
    const rowEl = h("div", { class: "pal-row" + (i === palSel ? " sel" : ""), onclick: (ev) => { if (ev.target.closest(".switch")) return; closePal(); jump(e.cat, e.anchor); } },
      h("div", { class: "rtext", style: "pointer-events:none" }, h("span", { class: "rlab" }, e.label), h("span", { class: "rdesc" }, e.desc)),
      right);
    rowEl.addEventListener("mousemove", () => { if (palSel !== i) { palSel = i; renderPal(); } });
    box.append(rowEl);
  }
  if (cats.length) box.append(h("div", { class: "pal-glabel" }, "Jump to"));
  for (const id of cats) {
    const i = idx++;
    const c = CATS[id];
    const rowEl = h("div", { class: "pal-row" + (i === palSel ? " sel" : ""), onclick: () => { closePal(); jump(id); } },
      h("span", { style: "color:var(--dim); width:16px; text-align:center;" }, c.icon),

      h("span", { class: "scope " + c.scope[0] }, c.scope[1]));
    rowEl.addEventListener("mousemove", () => { if (palSel !== i) { palSel = i; renderPal(); } });
    box.append(rowEl);

}
function openPal(prefill) {

function palEnter() {

  $("#panel").scrollTop = 0;
}

/* ---------- global keys ---------- */
window.addEventListener("keydown", (e) => {
  // chord recording swallows everything first, Escape cancels (the KeyboardPanel contract)
  if (state.recording) {
    e.preventDefault(); e.stopPropagation();
    if (e.key === "Escape") { state.recording = null; render(); return; }
    const chord = chordFromEvent(e);
    if (!chord) return;
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Escape"].includes(e.key)) {
      state.kbError = chord + " is reserved for grid navigation."; render(); return;
    }
    state.bindings[state.recording] = chord;
    state.recording = null; state.kbError = null; render();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palOpen ? closePal() : openPal(""); return; }
  if (palOpen) {
    if (e.key === "Escape") { closePal(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); palSel++; renderPal(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); palSel = Math.max(0, palSel - 1); renderPal(); return; }
    if (e.key === "Enter") { e.preventDefault(); palEnter(); return; }
  }
});
$("#palInput").addEventListener("input", () => { palSel = 0; renderPal(); });
$("#palVeil").addEventListener("click", closePal);
$("#gearBtn").addEventListener("click", () => openPal(""));
window.addEventListener("hashchange", () => {
  const id = location.hash.slice(1);
  if (PANELS[id]) { state.active = id; render(); }
});

/* boot: honor #category and ?search= deep links */
(function boot() {
  const id = location.hash.slice(1);
  if (PANELS[id]) state.active = id;
  render();
  const q = new URLSearchParams(location.search).get("search");
  if (q !== null) openPal(q);
})();
</script>
</body>
</html>
